spring:
  application:
    name: podgon-server
  datasource:
    url: ${PODGON_DB_URL:jdbc:postgresql://localhost:5432/podgon}
    username: ${PODGON_DB_USER:podgon}
    password: ${PODGON_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # ошибки в формате RFC 9457 application/problem+json
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PODGON_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
