        допустима только у личной (иначе 400, поле `categoryId`). 409 `LIMIT_EXCEEDED` — достигнут лимит.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
