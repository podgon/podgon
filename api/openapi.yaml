openapi: 3.0.3
info:
  title: Podgon API
  version: 0.13.0
  description: |
    Контракт API Podgon (contract-first, ADR-005). Этап 2: вход по одноразовому коду, регистрация,
    токены, профиль и сессии устройств. Этап 4: группы, участники, роли, приглашения. Этап 5: категории групп. Этап 6: рекомендации, публикации в группы, лента. Этап 7: поиск и фильтры.

    Этап 8.1: клиент передаёт `X-Client-Platform` (`android`, `ios`) и `X-Client-Version` (номер сборки);
    устаревшая сборка получает 426 `UPGRADE_REQUIRED` на любой запрос. Авторизованные запросы ограничены
    по частоте на пользователя (429 `RATE_LIMITED` + `Retry-After`); отозванная сессия и заблокированный
    пользователь получают 401 сразу.

    Этап 8.2 (0.9.0): категории групп заменены общим набором (`GET /categories`, ADR-011), категория — поле
    рекомендации. У каждого пользователя две системные группы — «Личное» и «Избранное» (id в профиле): их
    ленты и теги доступны владельцу, управление ими (участники, роли, приглашения, выход, удаление, правка)
    даёт 409 `SYSTEM_GROUP`; в `GET /groups` они не входят.

    Лента (этап 8.2.2): в списках каждая рекомендация один раз (`groupIds`, `sharedAt` — самая свежая публикация
    в области), фильтры `authorIds`, `minRating`, `maxRating`, секции (`section`, оглавление `GET /feed`),
    счётчики `facets`, сохранённые фильтры и закрепления `/me/filters`.

    Этап 8.3 (0.10.0): поиск только по названиям (`titleOnly`), роль автора в публикациях рекомендации
    (`PublicationInfo.authorRole`). 0.11.0: избранное — `PUT/DELETE /me/favorites/{reviewId}`, признак `favorite`
    в карточке и подробностях рекомендации. 0.12.0: фото рекомендации (`/reviews/{reviewId}/photo`) и аватары
    (`/me/avatar`, `/users/{userId}/avatar`); тело загрузки — сама картинка (JPEG или PNG, до 10 МБ), сервер
    уменьшает её и перекодирует в JPEG без метаданных; картинка отдаётся с идентификатором в адресе (`?v=`).
    0.13.0: уведомления в приложении (`/me/notifications`, настройки `/me/notification-settings`), подписка
    на сохранённый фильтр (`subscribed`), входящие адресные приглашения (`GET /me/invitations`) и вступление
    по `invitationId` вместо кода.

    Ошибки — `application/problem+json` (RFC 9457) с машинным полем `code` (см. `ErrorCode`
    в shared-contract); текст для пользователя формирует клиент.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Вход и регистрация (без авторизации)
  - name: me
    description: Профиль и сессии текущего пользователя
  - name: groups
    description: Группы, участники, роли
  - name: categories
    description: Общий набор категорий
  - name: reviews
    description: Рекомендации, публикации в группы, ленты
  - name: invitations
    description: Приглашения в группы
  - name: filters
    description: Оглавление ленты, счётчики и сохранённые фильтры

paths:
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Запросить одноразовый код входа
      description: |
        Всегда отвечает 202 при корректном запросе — независимо от того, зарегистрирован ли email.
        Лимиты: интервал между кодами, число кодов в час на email и на IP (429 с `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202': { description: Код отправлен (или запрос принят без отправки) }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Проверить код
      description: |
        Если аккаунт существует — возвращает токены; иначе `registrationToken` для завершения регистрации.
        Ошибка `INVALID_CODE` не различает неверный, просроченный, использованный код и исчерпанные попытки.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Код принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Завершить регистрацию
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Обменять refresh-токен на новую пару
      description: Refresh одноразовый. Повторное предъявление уже обменянного токена отзывает всю сессию.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить сессию
      description: "Идемпотентно: неизвестный токен не считается ошибкой."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Сессия завершена }
        '400': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Мой профиль
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Изменить профиль
      description: Поля, которых нет в запросе, не меняются. Пустой `bio` очищает биографию.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/sessions:
    get:
      tags: [me]
      operationId: listSessions
      summary: Мои сессии (устройства)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Активные сессии
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeSession
      summary: Завершить сессию на устройстве
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Сессия завершена }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups:
    post:
      tags: [groups]
      operationId: createGroup
      summary: Создать группу (создатель становится администратором)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Группа создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    get:
      tags: [groups]
      operationId: listGroups
      summary: Мои группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Группы, в которых состоит пользователь
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: getGroup
      summary: Группа
      description: Не участнику группа не видна (404); своя системная группа — 409 `SYSTEM_GROUP`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Группа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Изменить название и описание (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGroupRequest' }
      responses:
        '200':
          description: Обновлённая группа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    delete:
      tags: [groups]
      operationId: deleteGroup
      summary: Удалить группу (администратор)
      description: |
        Необратимо; требует `confirm=true`, иначе 400 `CONFIRMATION_REQUIRED`. Публикации в группе удаляются.
        Судьба рекомендаций, опубликованных только в этой группе: `RETURN_TO_PERSONAL` (по умолчанию) — переходят
        в «Личное» авторов, `DELETE` — удаляются. Опубликованные ещё где-то остаются в любом случае. Рекомендации
        группы удаляются и из чужого «Избранного», если больше не видны его владельцу.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: confirm
          in: query
          schema: { type: boolean }
        - name: reviews
          in: query
          schema: { $ref: '#/components/schemas/ReviewsFate' }
      responses:
        '204': { description: Группа удалена }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/leave:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [groups]
      operationId: leaveGroup
      summary: Выйти из группы
      description: |
        Единственный администратор выйти не может (409 `LAST_ADMIN`). С `deleteMyReviews=true` публикации
        пользователя в этой группе удаляются (сами рекомендации остаются у него; не опубликованные больше нигде
        переходят в «Личное»). Рекомендации группы, которые пользователю больше не видны, убираются из его «Избранного».
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deleteMyReviews
          in: query
          schema: { type: boolean }
      responses:
        '204': { description: Пользователь вышел из группы }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/delete-impact:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: groupDeleteImpact
      summary: Что будет с рекомендациями при удалении группы (администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Число рекомендаций и публикаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDeleteImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/leave-impact:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: leaveImpact
      summary: Сколько публикаций пользователя в группе (для предложения удалить их при выходе)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Число публикаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/delete-impact:
    get:
      tags: [me]
      operationId: accountDeleteImpact
      summary: Что будет при удалении аккаунта
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Число рекомендаций и группы, мешающие удалению
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeleteImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/deletion/code:
    post:
      tags: [me]
      operationId: requestAccountDeletionCode
      summary: Выслать на почту код подтверждения удаления аккаунта
      description: Лимиты те же, что у кода входа (429 `RATE_LIMITED` с `Retry-After`).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Код поставлен в очередь на отправку }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/deletion:
    post:
      tags: [me]
      operationId: deleteAccount
      summary: Удалить аккаунт
      description: |
        Подтверждается кодом из письма (`INVALID_CODE` при ошибке). Если пользователь — единственный администратор
        группы с другими участниками, 409 `LAST_ADMIN`: сначала передать права или удалить группу. Группы, где он
        единственный участник, удаляются. С `deleteReviews=false` рекомендации с публикациями в обычных группах
        переходят служебному пользователю «Удалённый пользователь» (и остаются в чужом «Избранном»), личные
        удаляются; с `true` удаляются все. «Личное» и «Избранное» удаляются. Все сессии завершаются.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Аккаунт удалён }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: listMembers
      summary: Участники группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Участники (администраторы первыми)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [groups]
      operationId: removeMember
      summary: Удалить участника (администратор)
      description: Себя удалить нельзя — для этого есть выход из группы.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Участник удалён }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [groups]
      operationId: setMemberRole
      summary: Назначить роль участнику (администратор)
      description: Снять роль администратора с последнего администратора нельзя (409 `LAST_ADMIN`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMemberRoleRequest' }
      responses:
        '200':
          description: Участник с новой ролью
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/roles:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: listRoles
      summary: Роли группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Системные и пользовательские роли
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
