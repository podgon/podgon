openapi: 3.0.3
info:
  title: Podgon API
  version: 0.3.0
  description: |
    Контракт API Podgon (contract-first, ADR-005). Этап 2: вход по одноразовому коду, регистрация,
    токены, профиль и сессии устройств. Этап 4: группы, участники, роли, приглашения.

    Ошибки — `application/problem+json` (RFC 9457) с машинным полем `code` (см. `ErrorCode`
    в shared-contract); текст для пользователя формирует клиент.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Вход и регистрация (без авторизации)
  - name: me
    description: Профиль и сессии текущего пользователя
  - name: groups
    description: Группы, участники, роли
  - name: invitations
    description: Приглашения в группы

paths:
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Запросить одноразовый код входа
      description: |
        Всегда отвечает 202 при корректном запросе — независимо от того, зарегистрирован ли email.
        Лимиты: интервал между кодами, число кодов в час на email и на IP (429 с `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202': { description: Код отправлен (или запрос принят без отправки) }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Проверить код
      description: |
        Если аккаунт существует — возвращает токены; иначе `registrationToken` для завершения регистрации.
        Ошибка `INVALID_CODE` не различает неверный, просроченный, использованный код и исчерпанные попытки.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Код принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Завершить регистрацию
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Обменять refresh-токен на новую пару
      description: Refresh одноразовый. Повторное предъявление уже обменянного токена отзывает всю сессию.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить сессию
      description: "Идемпотентно: неизвестный токен не считается ошибкой."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Сессия завершена }
        '400': { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Мой профиль
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Изменить профиль
      description: Поля, которых нет в запросе, не меняются. Пустой `bio` очищает биографию.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /me/sessions:
    get:
      tags: [me]
      operationId: listSessions
      summary: Мои сессии (устройства)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Активные сессии
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Problem' }

  /me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeSession
      summary: Завершить сессию на устройстве
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Сессия завершена }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups:
    post:
      tags: [groups]
      operationId: createGroup
      summary: Создать группу (создатель становится администратором)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Группа создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      tags: [groups]
      operationId: listGroups
      summary: Мои группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Группы, в которых состоит пользователь
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: getGroup
      summary: Группа
      description: Не участнику группа не видна (404).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Группа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Изменить название и описание (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGroupRequest' }
      responses:
        '200':
          description: Обновлённая группа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [groups]
      operationId: deleteGroup
      summary: Удалить группу (администратор)
      description: Необратимо; требует `confirm=true`, иначе 400 `CONFIRMATION_REQUIRED`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: confirm
          in: query
          schema: { type: boolean }
      responses:
        '204': { description: Группа удалена }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/leave:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [groups]
      operationId: leaveGroup
      summary: Выйти из группы
      description: Единственный администратор выйти не может (409 `LAST_ADMIN`).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Пользователь вышел из группы }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: listMembers
      summary: Участники группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Участники (администраторы первыми)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [groups]
      operationId: removeMember
      summary: Удалить участника (администратор)
      description: Себя удалить нельзя — для этого есть выход из группы.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Участник удалён }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [groups]
      operationId: setMemberRole
      summary: Назначить роль участнику (администратор)
      description: Снять роль администратора с последнего администратора нельзя (409 `LAST_ADMIN`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMemberRoleRequest' }
      responses:
        '200':
          description: Участник с новой ролью
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/roles:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: listRoles
      summary: Роли группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Системные и пользовательские роли
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [groups]
      operationId: createRole
      summary: Создать пользовательскую роль (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RoleId'
    patch:
      tags: [groups]
      operationId: updateRole
      summary: Изменить пользовательскую роль (администратор)
      description: Системные роли менять нельзя (403). Лишение роли прав администратора у последнего администратора — 409 `LAST_ADMIN`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: Обновлённая роль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [groups]
      operationId: deleteRole
      summary: Удалить пользовательскую роль (администратор)
      description: Участники с этой ролью получают роль MEMBER. Системные роли удалять нельзя (403).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Роль удалена }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/invitations:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Создать приглашение (администратор)
      description: |
        Токен возвращается только здесь. Если указан `email`, ему уходит письмо с токеном, и вступить
        по этому приглашению сможет только владелец адреса.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Приглашения группы (администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Приглашения, новые первыми; токены не возвращаются
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvitationInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /groups/{groupId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Отозвать приглашение (администратор)
      description: Идемпотентно.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Приглашение отозвано }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /invitations/preview:
    post:
      tags: [invitations]
      operationId: previewInvitation
      summary: Посмотреть, в какую группу приглашают
      description: Токен передаётся в теле, а не в адресе, чтобы не попадать в журналы доступа.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationTokenRequest' }
      responses:
        '200':
          description: Сведения о группе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Вступить в группу по приглашению
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationTokenRequest' }
      responses:
        '200':
          description: Пользователь вступил в группу
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Слишком частые запросы
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - CAPTCHA_FAILED
            - RATE_LIMITED
            - INVALID_CODE
            - INVALID_REGISTRATION_TOKEN
            - INVALID_REFRESH_TOKEN
            - UNAUTHORIZED
            - FORBIDDEN
            - USER_BLOCKED
            - NOT_FOUND
            - USERNAME_TAKEN
            - EMAIL_ALREADY_REGISTERED
            - LAST_ADMIN
            - INVALID_INVITATION
            - ALREADY_MEMBER
            - LIMIT_EXCEEDED
            - CONFIRMATION_REQUIRED
            - INTERNAL_ERROR
        errors:
          type: array
          description: Ошибки полей (для `VALIDATION_FAILED`)
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string }
              reason:
                type: string
                enum: [REQUIRED, TOO_SHORT, TOO_LONG, INVALID_FORMAT, RESERVED]

    OtpRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        captchaToken: { type: string, nullable: true }

    OtpVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        deviceInfo: { type: string, maxLength: 200, nullable: true }

    OtpVerifyResponse:
      type: object
      description: Заполнено ровно одно из полей.
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        registrationToken: { type: string }

    RegisterRequest:
      type: object
      required: [registrationToken, username, displayName]
      properties:
        registrationToken: { type: string }
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.]+$'
          description: Уникален без учёта регистра; префикс `deleted_` зарезервирован.
        displayName: { type: string, maxLength: 60 }
        deviceInfo: { type: string, maxLength: 200, nullable: true }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          type: integer
          format: int64
          description: Срок жизни access-токена, секунд

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    UserProfile:
      type: object
      required: [id, email, username, displayName, bio, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string }
        displayName: { type: string }
        bio: { type: string }
        locale: { type: string, enum: [ru, en] }

    UpdateProfileRequest:
      type: object
      properties:
        username: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        bio: { type: string, maxLength: 120, nullable: true }
        locale: { type: string, enum: [ru, en], nullable: true }

    SessionInfo:
      type: object
      required: [id, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceInfo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
