        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница рекомендаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/tags:
    get:
      tags: [reviews]
      operationId: listMyTags
      summary: Теги моих групп и «Личного» с числом рекомендаций (до 100, самые частые первыми)
      description: Автодополнение в форме и на вкладке «Все».
      security: [{ bearerAuth: [] }]
      parameters:
        - name: prefix
          in: query
          description: Начало тега (автодополнение).
          schema: { type: string, maxLength: 31 }
      responses:
        '200':
          description: Теги
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagCount' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /feed:
    get:
      tags: [filters]
      operationId: feedToc
      summary: Оглавление ленты — секции в порядке показа
      description: |
        Без `groupId` — «Все» (мои обычные группы); допустимы id своих «Личного» и «Избранного», чужая группа — 404.
        Порядок (И29): закреплённые фильтры → закреплённые категории (в порядке пользователя) → остальные корневые
        категории по `lastSharedAt`, «Без категории» — последней. Фильтр панели накладывается на каждую секцию;
        пустые секции не возвращаются. Записи секции — ленты с параметром `section`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/TagMode'
        - $ref: '#/components/parameters/AuthorIds'
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/MaxRating'
      responses:
        '200':
          description: Оглавление
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedToc' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /reviews/facets:
    get:
      tags: [filters]
      operationId: facets
      summary: Счётчики выборки «Все» (или выбранных групп) для панели фильтров
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupIds
          in: query
          description: Группы через запятую.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items: { type: string, format: uuid }
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TitleOnly'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/TagMode'
        - $ref: '#/components/parameters/AuthorIds'
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/MaxRating'
        - $ref: '#/components/parameters/Section'
      responses:
        '200':
          description: Счётчики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facets' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/facets:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [filters]
      operationId: groupFacets
      summary: Счётчики выборки группы для панели фильтров
      description: Работает и для своих системных групп; в «Личном» авторов нет.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TitleOnly'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/TagMode'
        - $ref: '#/components/parameters/AuthorIds'
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/MaxRating'
        - $ref: '#/components/parameters/Section'
      responses:
        '200':
          description: Счётчики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facets' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/filters:
    get:
      tags: [filters]
      operationId: listSavedFilters
      summary: Сохранённые фильтры и закреплённые категории
      description: Сначала закреплённые фильтры и категории (по позиции), затем незакреплённые фильтры по имени.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Записи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedFilter' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    post:
      tags: [filters]
      operationId: createSavedFilter
      summary: Сохранить фильтр или закрепить категорию
      description: |
        `FILTER` — `name` и `definition` (с `inFeed` — сразу закреплён секцией); `CATEGORY` — `categoryId`
        корневой категории набора. Повторное закрепление категории — 409 `ALREADY_PINNED`, больше 50 записей —
        409 `LIMIT_EXCEEDED`. Закреплённая запись встаёт последней в своём виде.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedFilterRequest' }
      responses:
        '201':
          description: Запись создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/filters/order:
    put:
      tags: [filters]
      operationId: orderSavedFilters
      summary: Порядок закреплённых секций
      description: Полный порядок закреплённых фильтров и закреплённых категорий (id записей); состав должен совпадать с закреплёнными, иначе 400.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedFilterOrderRequest' }
      responses:
        '200':
          description: Записи в новом порядке
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedFilter' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/filters/{filterId}:
    parameters:
      - name: filterId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [filters]
      operationId: updateSavedFilter
      summary: Изменить сохранённый фильтр (название, определение, закрепление)
      description: Закреплённую категорию не правят — её открепляют удалением (400).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSavedFilterRequest' }
      responses:
        '200':
          description: Обновлённая запись
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    delete:
      tags: [filters]
      operationId: deleteSavedFilter
      summary: Удалить фильтр или открепить категорию
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Запись удалена }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/reviews:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [reviews]
      operationId: listGroupReviews
      summary: Лента группы (новые публикации сверху)
      description: |
        Только для участников (иначе 404); работает и для своих системных групп. Без `q` — по времени
        публикации, с `q` — по релевантности. `section` — записи одной секции оглавления (`GET /feed`),
        накладывается на остальные фильтры; вместе с `q` — 400.
        Курсор действует только с теми же фильтрами; курсор другого режима — 400.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TitleOnly'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/TagMode'
        - $ref: '#/components/parameters/AuthorIds'
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/MaxRating'
        - $ref: '#/components/parameters/Section'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/invitations:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Создать приглашение (администратор)
      description: |
        Токен возвращается только здесь. Если указан `email`, ему уходит письмо с токеном, и вступить
        по этому приглашению сможет только владелец адреса.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Приглашения группы (администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Приглашения, новые первыми; токены не возвращаются
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvitationInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Отозвать приглашение (администратор)
      description: Идемпотентно.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Приглашение отозвано }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /invitations/preview:
    post:
      tags: [invitations]
      operationId: previewInvitation
      summary: Посмотреть, в какую группу приглашают
      description: Токен передаётся в теле, а не в адресе, чтобы не попадать в журналы доступа.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationTokenRequest' }
      responses:
        '200':
          description: Сведения о группе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /invitations/share-preview:
    post:
      tags: [invitations]
      operationId: sharePreview
      summary: Предпросмотр переноса своих рекомендаций в группу, куда ведёт приглашение
      description: Ничего не меняет. Отбираются только групповые рекомендации пользователя (личные не переносятся).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharePreviewRequest' }
      responses:
        '200':
          description: Что будет перенесено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Вступить в группу по приглашению
      security: [{ bearerAuth: [] }]
      description: |
        Необязательное `share` публикует групповые рекомендации пользователя в новой группе по правилу
        (см. `share-preview`); личные не переносятся.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Пользователь вступил в группу
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `nextCursor` предыдущей страницы.
      schema: { type: string, maxLength: 200 }
    SearchQuery:
      name: q
      in: query
      description: Поиск по названию и описанию (морфология русского, опечатки, подстроки); с ним выдача упорядочена по релевантности.
      schema: { type: string, maxLength: 100 }
    ImageVersion:
      name: v
      in: query
      description: Идентификатор картинки из `photoId`/`avatarId` — делает адрес уникальным для кэша; сервер его не проверяет.
      schema: { type: string, maxLength: 64 }
    TitleOnly:
      name: titleOnly
      in: query
      description: Этап 8.3. `true` — искать `q` только в названиях, без описаний.
      schema: { type: boolean, default: false }
    CategoryIds:
      name: categoryIds
      in: query
      description: Категории набора через запятую; корень включает подкатегории.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 20
        items: { type: string, format: uuid }
    Tags:
      name: tags
      in: query
      description: Теги без `#`, через запятую.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 10
        items: { type: string, maxLength: 31 }
    TagMode:
      name: tagMode
      in: query
      description: «все теги» (по умолчанию) или «любой из тегов».
      schema: { type: string, enum: [ALL, ANY], default: ALL }
    AuthorIds:
      name: authorIds
      in: query
      description: Авторы через запятую.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 20
        items: { type: string, format: uuid }
    MinRating:
      name: minRating
      in: query
      schema: { type: integer, minimum: 1, maximum: 10 }
    MaxRating:
      name: maxRating
      in: query
      schema: { type: integer, minimum: 1, maximum: 10 }
    Section:
      name: section
      in: query
      description: 'Секция ленты: `category:<categoryId>` или `filter:<savedFilterId>` (из оглавления); пересекается с остальными фильтрами.'
      schema: { type: string, maxLength: 60 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpgradeRequired:
      description: Версия приложения устарела (заголовки `X-Client-Platform` и `X-Client-Version` ниже минимальной), нужно обновить приложение
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Слишком частые запросы
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: |
            Машинный код ошибки (`ErrorCode` в shared-contract). Список расширяемый: новые коды добавляются
            без смены версии API, клиент обязан обрабатывать неизвестный код как общую ошибку.
          x-extensible-enum:
            - VALIDATION_FAILED
            - CAPTCHA_FAILED
            - RATE_LIMITED
            - INVALID_CODE
            - INVALID_REGISTRATION_TOKEN
            - INVALID_REFRESH_TOKEN
            - UNAUTHORIZED
            - FORBIDDEN
            - USER_BLOCKED
            - NOT_FOUND
            - USERNAME_TAKEN
            - EMAIL_ALREADY_REGISTERED
            - LAST_ADMIN
            - INVALID_INVITATION
            - ALREADY_MEMBER
            - LIMIT_EXCEEDED
            - CONFIRMATION_REQUIRED
            - SYSTEM_GROUP
            - ALREADY_PINNED
            - UPGRADE_REQUIRED
            - INTERNAL_ERROR
        errors:
          type: array
          description: Ошибки полей (для `VALIDATION_FAILED`)
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string }
              reason:
                type: string
                enum: [REQUIRED, TOO_SHORT, TOO_LONG, INVALID_FORMAT, RESERVED]

    OtpRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        captchaToken: { type: string, nullable: true }

    OtpVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        deviceInfo: { type: string, maxLength: 200, nullable: true }

    OtpVerifyResponse:
      type: object
      description: Заполнено ровно одно из полей.
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        registrationToken: { type: string }

    RegisterRequest:
      type: object
      required: [registrationToken, username, displayName]
      properties:
        registrationToken: { type: string }
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.]+$'
          description: Уникален без учёта регистра; префикс `deleted_` зарезервирован.
        displayName: { type: string, maxLength: 60 }
        deviceInfo: { type: string, maxLength: 200, nullable: true }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          type: integer
          format: int64
          description: Срок жизни access-токена, секунд

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    UserProfile:
      type: object
      required: [id, email, username, displayName, bio, locale, personalGroupId, favoritesGroupId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string }
        displayName: { type: string }
        bio: { type: string }
        locale: { type: string, enum: [ru, en] }
        personalGroupId: { type: string, format: uuid, description: Системная группа «Личное». }
        favoritesGroupId: { type: string, format: uuid, description: Системная группа «Избранное». }
        avatarId: { type: string, format: uuid, nullable: true, description: 'Этап 8.3. Свой аватар.' }

    UpdateProfileRequest:
      type: object
      properties:
        username: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        bio: { type: string, maxLength: 120, nullable: true }
        locale: { type: string, enum: [ru, en], nullable: true }

    SessionInfo:
      type: object
      required: [id, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceInfo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }

    RoleInfo:
      type: object
      required: [id, code, title, description, admin, system]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        admin: { type: boolean }
        system: { type: boolean }

    GroupSummary:
      type: object
      required: [id, name, description, memberCount, myRole, reviewCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        memberCount: { type: integer }
        myRole: { $ref: '#/components/schemas/RoleInfo' }
        reviewCount: { type: integer, description: 'Число рекомендаций, опубликованных в группе.' }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    UpdateGroupRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }

    MemberInfo:
      type: object
      required: [userId, username, displayName, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/RoleInfo' }
        joinedAt: { type: string, format: date-time }
        avatarId: { type: string, format: uuid, nullable: true }

    SetMemberRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId: { type: string }

    CreateRoleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 255 }
        admin: { type: boolean }

    UpdateRoleRequest:
      type: object
      properties:
        title: { type: string, maxLength: 60, nullable: true }
        description: { type: string, maxLength: 255, nullable: true }
        admin: { type: boolean, nullable: true }

    Category:
      type: object
      required: [id, key, parentId, name, sortOrder, system]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, description: 'Стабильный ключ из docs/categories.md (`food.coffee`).' }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string, description: Название на запрошенном языке. }
        sortOrder: { type: integer }
        system: { type: boolean, description: '«Без категории» (`key = none`): только для личных рекомендаций.' }
        archived: { type: boolean, default: false, description: Скрыта из выбора; нужна только для подписи старых рекомендаций. }

    CategorySet:
      type: object
      required: [version, items]
      properties:
        version: { type: string, description: 'Версия набора, совпадает с `ETag`.' }
        items:
          type: array
          description: Корни и подкатегории вперемешку в порядке `sortOrder`; дерево строится по `parentId`.
          items: { $ref: '#/components/schemas/Category' }

    ReviewAuthor:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarId: { type: string, format: uuid, nullable: true, description: 'Этап 8.3. Нет — аватар по умолчанию.' }

    PublicationInfo:
      type: object
      required: [groupId, sharedAt]
      properties:
        groupId: { type: string, format: uuid }
        sharedAt: { type: string, format: date-time }
        authorRole:
          description: Этап 8.3. Роль автора в группе; нет — автор уже не участник.
          allOf: [{ $ref: '#/components/schemas/RoleInfo' }]
          nullable: true

    ReviewDetails:
      type: object
      required: [id, title, description, rating, categoryId, tags, author, createdAt, updatedAt, personal, publications]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        rating: { type: integer, minimum: 1, maximum: 10 }
        categoryId: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }
        author: { $ref: '#/components/schemas/ReviewAuthor' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        personal: { type: boolean, description: 'Личная: опубликована только в «Личном».' }
        publications:
          type: array
          description: Только обычные группы; автору — все публикации, остальным — только в их группах.
          items: { $ref: '#/components/schemas/PublicationInfo' }
        favorite: { type: boolean, default: false, description: 'Этап 8.3. В моём «Избранном».' }
        photoId: { type: string, format: uuid, nullable: true, description: 'Этап 8.3. Фото; нет — без фото.' }

    CreateReviewRequest:
      type: object
      required: [title, rating, categoryId]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        rating: { type: integer, minimum: 1, maximum: 10 }
        categoryId: { type: string, format: uuid }
        tags:
          type: array
          maxItems: 10
          description: Без `#`; регистр и различие «е»/«ё» не учитываются, повторы убираются.
          items: { type: string, maxLength: 31 }
        groupIds:
          type: array
          maxItems: 50
          description: Обычные группы, где я участник. Пусто или нет поля — рекомендация личная.
          items: { type: string, format: uuid }

    UpdateReviewRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        tags:
          type: array
          nullable: true
          maxItems: 10
          items: { type: string, maxLength: 31 }

    SetPublicationsRequest:
      type: object
      required: [groupIds]
      properties:
        groupIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }

    ReviewCard:
      type: object
      required: [id, title, excerpt, rating, tags, author, createdAt, categoryId, sharedAt, groupIds]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string, maxLength: 200 }
        rating: { type: integer }
        tags:
          type: array
          items: { type: string }
        author: { $ref: '#/components/schemas/ReviewAuthor' }
        createdAt: { type: string, format: date-time }
        categoryId: { type: string, format: uuid }
        sharedAt:
          type: string
          format: date-time
          description: 'Самая свежая публикация в области запроса (в «Моих» — по обычным группам; в «Избранном» — добавление).'
        groupIds:
          type: array
          description: Группы публикации в области запроса (на «Все» — мои группы, в группе — одна).
          items: { type: string, format: uuid }
        favorite: { type: boolean, default: false, description: 'Этап 8.3. В моём «Избранном».' }
        photoId: { type: string, format: uuid, nullable: true, description: 'Этап 8.3. Фото; нет — без фото.' }

    TagCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    ReviewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewCard' }
        nextCursor: { type: string, nullable: true }

    CreateInvitationRequest:
      type: object
      properties:
        email: { type: string, maxLength: 254, nullable: true }
        maxUses: { type: integer, minimum: 1, maximum: 100, default: 1 }
        ttlHours: { type: integer, minimum: 1, maximum: 720, default: 168 }

    InvitationCreated:
      type: object
      required: [id, token, expiresAt, maxUses]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: Показывается один раз }
        email: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }

    InvitationInfo:
      type: object
      required: [id, createdBy, createdAt, expiresAt, maxUses, usedCount, revoked, active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        createdBy: { type: string, description: username автора }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }
        usedCount: { type: integer }
        revoked: { type: boolean }
        active: { type: boolean }

    InvitationTokenRequest:
      type: object
      description: Нужно ровно одно из `token` и `invitationId` (этап 8.3); иначе 400 `INVALID_INVITATION`.
      properties:
        token: { type: string, maxLength: 200, nullable: true }
        invitationId: { type: string, format: uuid, nullable: true, description: 'Входящее адресное приглашение.' }

    ShareMode:
      type: string
      enum: [NONE, ALL, CATEGORIES, CATEGORIES_EXCEPT, TAGS, TAGS_EXCEPT]

    ShareRule:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/ShareMode' }
        categoryIds:
          type: array
          maxItems: 20
          description: 'Категории набора (для `CATEGORIES` и `CATEGORIES_EXCEPT`); корень включает подкатегории.'
          items: { type: string, format: uuid }
        tags:
          type: array
          maxItems: 10
          description: 'Теги (для `TAGS` и `TAGS_EXCEPT`): достаточно любого из них.'
          items: { type: string }

    SharePreviewRequest:
      type: object
      required: [share]
      properties:
        token: { type: string, maxLength: 200, nullable: true }
        invitationId: { type: string, format: uuid, nullable: true }
        share: { $ref: '#/components/schemas/ShareRule' }

    SharePreviewItem:
      type: object
      required: [reviewId, title, categoryId]
      properties:
        reviewId: { type: string, format: uuid }
        title: { type: string }
        categoryId: { type: string, format: uuid }

    SharePreview:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, description: Сколько рекомендаций отобрано правилом. }
        items:
          type: array
          maxItems: 100
          description: Первые из них — для списка «Будет опубликовано».
          items: { $ref: '#/components/schemas/SharePreviewItem' }

    AcceptInvitationRequest:
      type: object
      properties:
        token: { type: string, maxLength: 200, nullable: true }
        invitationId: { type: string, format: uuid, nullable: true }
        share: { $ref: '#/components/schemas/ShareRule' }

    ReviewsFate:
      type: string
      enum: [RETURN_TO_PERSONAL, DELETE]

    GroupDeleteImpact:
      type: object
      required: [exclusiveReviews, publications]
      properties:
        exclusiveReviews: { type: integer, description: 'Рекомендации, опубликованные только в этой группе.' }
        publications: { type: integer, description: Все публикации в группе. }

    LeaveImpact:
      type: object
      required: [myPublications]
      properties:
        myPublications: { type: integer }

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    AccountDeleteImpact:
      type: object
      required: [reviews, publishedReviews, blockingGroups]
      properties:
        reviews: { type: integer }
        publishedReviews: { type: integer, description: Из них опубликованные хотя бы в одной группе. }
        blockingGroups:
          type: array
          description: Группы, где пользователь единственный администратор при наличии других участников.
          items: { $ref: '#/components/schemas/GroupRef' }

    DeleteAccountRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        deleteReviews: { type: boolean, default: false }

    InvitationPreview:
      type: object
      required: [groupName, groupDescription, memberCount, invitedBy]
      properties:
        groupName: { type: string }
        groupDescription: { type: string }
        memberCount: { type: integer }
        invitedBy: { type: string }

    TagMode:
      type: string
      enum: [ALL, ANY]

    FilterDefinition:
      type: object
      description: Определение сохранённого фильтра (версия `v`); группа не сохраняется, удалённые теги игнорируются.
      required: [v]
      properties:
        v: { type: integer, enum: [1] }
        q: { type: string, maxLength: 100, nullable: true, description: 'Только при применении в панели: в секции поиска нет.' }
        categoryIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 31 }
        tagMode: { $ref: '#/components/schemas/TagMode' }
        authorIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        minRating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        maxRating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        titleOnly: { type: boolean, default: false, description: 'Этап 8.3. Искать `q` только в названиях.' }

    SavedFilterKind:
      type: string
      enum: [FILTER, CATEGORY]

    SavedFilter:
      type: object
      required: [id, kind, inFeed]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SavedFilterKind' }
        inFeed: { type: boolean, description: 'Закреплён секцией ленты; у CATEGORY всегда true.' }
        name: { type: string, maxLength: 60, nullable: true, description: Только у FILTER. }
        categoryId: { type: string, format: uuid, nullable: true, description: Только у CATEGORY. }
        definition: { $ref: '#/components/schemas/FilterDefinition' }
        position: { type: integer, nullable: true, description: Порядок среди закреплённых своего вида. }
        subscribed: { type: boolean, default: false, description: 'Этап 8.3. Уведомлять о новых подходящих рекомендациях.' }

    CreateSavedFilterRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/SavedFilterKind' }
        name: { type: string, maxLength: 60, nullable: true }
        definition: { $ref: '#/components/schemas/FilterDefinition' }
        inFeed: { type: boolean, default: false }
        categoryId: { type: string, format: uuid, nullable: true }
        subscribed: { type: boolean, default: false, description: 'Только у FILTER.' }

    UpdateSavedFilterRequest:
      type: object
      properties:
        name: { type: string, maxLength: 60, nullable: true }
        definition: { $ref: '#/components/schemas/FilterDefinition' }
        inFeed: { type: boolean, nullable: true }
        subscribed: { type: boolean, nullable: true }

    NotificationKind:
      type: string
      enum: [INVITATION, FILTER_MATCH]

    NotificationInfo:
      type: object
      description: Подписи сохранены при создании; объект мог уже измениться или стать недоступным.
      required: [id, kind, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        invitationId: { type: string, format: uuid, nullable: true }
        groupName: { type: string, nullable: true }
        invitedBy: { type: string, nullable: true }
        reviewId: { type: string, format: uuid, nullable: true }
        reviewTitle: { type: string, nullable: true }
        filterName: { type: string, nullable: true }

    NotificationPage:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationInfo' }
        unread: { type: integer }
        nextCursor: { type: string, nullable: true }

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    MarkReadRequest:
      type: object
      properties:
        ids:
          type: array
          nullable: true
          maxItems: 100
          description: Нет — отметить все.
          items: { type: string, format: uuid }

    NotificationSettings:
      type: object
      properties:
        invitations: { type: boolean, default: true }
        filterMatches: { type: boolean, default: true }

    IncomingInvitation:
      type: object
      required: [id, groupName, groupDescription, memberCount, invitedBy, expiresAt]
      properties:
        id: { type: string, format: uuid }
        groupName: { type: string }
        groupDescription: { type: string }
        memberCount: { type: integer }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }

    SavedFilterOrderRequest:
      type: object
      required: [filterIds, categoryIds]
      properties:
        filterIds:
          type: array
          description: Закреплённые записи-фильтры в новом порядке.
          items: { type: string, format: uuid }
        categoryIds:
          type: array
          description: Записи закреплённых категорий (id записей, не категорий) в новом порядке.
          items: { type: string, format: uuid }

    FeedSection:
      type: object
      required: [section, kind, pinned, count, lastSharedAt]
      properties:
        section: { type: string, description: 'Значение параметра section: category:<id> или filter:<id>.' }
        kind: { type: string, enum: [FILTER, CATEGORY] }
        pinned: { type: boolean }
        count: { type: integer }
        lastSharedAt: { type: string, format: date-time }
        categoryId: { type: string, format: uuid, nullable: true, description: Для CATEGORY. }
        filterId: { type: string, format: uuid, nullable: true, description: Для FILTER и закреплённой CATEGORY. }
        name: { type: string, nullable: true, description: 'Название фильтра; у категории — из набора на клиенте.' }

    FeedToc:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items: { $ref: '#/components/schemas/FeedSection' }

    CategoryCount:
      type: object
      required: [categoryId, count]
      properties:
        categoryId: { type: string, format: uuid }
        count: { type: integer, description: У корня — вместе с подкатегориями. }

    AuthorCount:
      type: object
      required: [author, count]
      properties:
        author: { $ref: '#/components/schemas/ReviewAuthor' }
        count: { type: integer }

    Facets:
      type: object
      required: [categories, tags, authors]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryCount' }
        tags:
          type: array
          maxItems: 100
          description: Самые частые первыми — они же популярные теги в подсказках поиска.
          items: { $ref: '#/components/schemas/TagCount' }
        authors:
          type: array
          description: Авторы выборки (в «Личном» — пусто).
          items: { $ref: '#/components/schemas/AuthorCount' }
