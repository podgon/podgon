openapi: 3.0.3
info:
  title: Podgon API
  version: 0.8.0
  description: |
    Контракт API Podgon (contract-first, ADR-005). Этап 2: вход по одноразовому коду, регистрация,
    токены, профиль и сессии устройств. Этап 4: группы, участники, роли, приглашения. Этап 5: категории групп. Этап 6: рекомендации, публикации в группы, лента. Этап 7: поиск и фильтры.

    Этап 8.1: клиент передаёт `X-Client-Platform` (`android`, `ios`) и `X-Client-Version` (номер сборки);
    устаревшая сборка получает 426 `UPGRADE_REQUIRED` на любой запрос. Авторизованные запросы ограничены
    по частоте на пользователя (429 `RATE_LIMITED` + `Retry-After`); отозванная сессия и заблокированный
    пользователь получают 401 сразу.

    Ошибки — `application/problem+json` (RFC 9457) с машинным полем `code` (см. `ErrorCode`
    в shared-contract); текст для пользователя формирует клиент.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Вход и регистрация (без авторизации)
  - name: me
    description: Профиль и сессии текущего пользователя
  - name: groups
    description: Группы, участники, роли
  - name: categories
    description: Категории группы (иерархия)
  - name: reviews
    description: Рекомендации, публикации в группы, ленты
  - name: invitations
    description: Приглашения в группы

paths:
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Запросить одноразовый код входа
      description: |
        Всегда отвечает 202 при корректном запросе — независимо от того, зарегистрирован ли email.
        Лимиты: интервал между кодами, число кодов в час на email и на IP (429 с `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202': { description: Код отправлен (или запрос принят без отправки) }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Проверить код
      description: |
        Если аккаунт существует — возвращает токены; иначе `registrationToken` для завершения регистрации.
        Ошибка `INVALID_CODE` не различает неверный, просроченный, использованный код и исчерпанные попытки.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Код принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Завершить регистрацию
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Обменять refresh-токен на новую пару
      description: Refresh одноразовый. Повторное предъявление уже обменянного токена отзывает всю сессию.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить сессию
      description: "Идемпотентно: неизвестный токен не считается ошибкой."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Сессия завершена }
        '400': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Мой профиль
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Изменить профиль
      description: Поля, которых нет в запросе, не меняются. Пустой `bio` очищает биографию.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/sessions:
    get:
      tags: [me]
      operationId: listSessions
      summary: Мои сессии (устройства)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Активные сессии
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeSession
      summary: Завершить сессию на устройстве
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Сессия завершена }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups:
    post:
      tags: [groups]
      operationId: createGroup
      summary: Создать группу (создатель становится администратором)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Группа создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    get:
      tags: [groups]
      operationId: listGroups
      summary: Мои группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Группы, в которых состоит пользователь
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: getGroup
      summary: Группа
      description: Не участнику группа не видна (404).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Группа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Изменить название и описание (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGroupRequest' }
      responses:
        '200':
          description: Обновлённая группа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    delete:
      tags: [groups]
      operationId: deleteGroup
      summary: Удалить группу (администратор)
      description: |
        Необратимо; требует `confirm=true`, иначе 400 `CONFIRMATION_REQUIRED`. Публикации в группе удаляются.
        Судьба рекомендаций, опубликованных только в этой группе: `RETURN_TO_PERSONAL` (по умолчанию) — остаются
        личными у авторов, `DELETE` — удаляются. Опубликованные ещё где-то остаются в любом случае.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: confirm
          in: query
          schema: { type: boolean }
        - name: reviews
          in: query
          schema: { $ref: '#/components/schemas/ReviewsFate' }
      responses:
        '204': { description: Группа удалена }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/leave:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [groups]
      operationId: leaveGroup
      summary: Выйти из группы
      description: |
        Единственный администратор выйти не может (409 `LAST_ADMIN`). С `deleteMyReviews=true` публикации
        пользователя в этой группе удаляются (сами рекомендации остаются у него).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deleteMyReviews
          in: query
          schema: { type: boolean }
      responses:
        '204': { description: Пользователь вышел из группы }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/delete-impact:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: groupDeleteImpact
      summary: Что будет с рекомендациями при удалении группы (администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Число рекомендаций и публикаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDeleteImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/leave-impact:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: leaveImpact
      summary: Сколько публикаций пользователя в группе (для предложения удалить их при выходе)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Число публикаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/delete-impact:
    get:
      tags: [me]
      operationId: accountDeleteImpact
      summary: Что будет при удалении аккаунта
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Число рекомендаций и группы, мешающие удалению
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeleteImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/deletion/code:
    post:
      tags: [me]
      operationId: requestAccountDeletionCode
      summary: Выслать на почту код подтверждения удаления аккаунта
      description: Лимиты те же, что у кода входа (429 `RATE_LIMITED` с `Retry-After`).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Код поставлен в очередь на отправку }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/deletion:
    post:
      tags: [me]
      operationId: deleteAccount
      summary: Удалить аккаунт
      description: |
        Подтверждается кодом из письма (`INVALID_CODE` при ошибке). Если пользователь — единственный администратор
        группы с другими участниками, 409 `LAST_ADMIN`: сначала передать права или удалить группу. Группы, где он
        единственный участник, удаляются. С `deleteReviews=false` рекомендации с публикациями переходят служебному
        пользователю «Удалённый пользователь», личные удаляются; с `true` удаляются все. Все сессии завершаются.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Аккаунт удалён }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: listMembers
      summary: Участники группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Участники (администраторы первыми)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [groups]
      operationId: removeMember
      summary: Удалить участника (администратор)
      description: Себя удалить нельзя — для этого есть выход из группы.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Участник удалён }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [groups]
      operationId: setMemberRole
      summary: Назначить роль участнику (администратор)
      description: Снять роль администратора с последнего администратора нельзя (409 `LAST_ADMIN`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMemberRoleRequest' }
      responses:
        '200':
          description: Участник с новой ролью
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/roles:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [groups]
      operationId: listRoles
      summary: Роли группы
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Системные и пользовательские роли
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    post:
      tags: [groups]
      operationId: createRole
      summary: Создать пользовательскую роль (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RoleId'
    patch:
      tags: [groups]
      operationId: updateRole
      summary: Изменить пользовательскую роль (администратор)
      description: Системные роли менять нельзя (403). Лишение роли прав администратора у последнего администратора — 409 `LAST_ADMIN`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: Обновлённая роль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    delete:
      tags: [groups]
      operationId: deleteRole
      summary: Удалить пользовательскую роль (администратор)
      description: Участники с этой ролью получают роль MEMBER. Системные роли удалять нельзя (403).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Роль удалена }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/categories:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [categories]
      operationId: listCategories
      summary: Категории группы (плоский список, упорядоченный; иерархия — по parentId)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    post:
      tags: [categories]
      operationId: createCategory
      summary: Создать категорию (администратор)
      description: 409 — `CATEGORY_NAME_TAKEN`, `CATEGORY_TOO_DEEP` или `LIMIT_EXCEEDED`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Изменить название и описание (администратор)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: Обновлённая категория
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Удалить категорию вместе с подкатегориями (администратор)
      description: |
        Если у категории есть подкатегории или публикации, требуется `confirm=true`, иначе 400
        `CONFIRMATION_REQUIRED` (последствия — в `delete-impact`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: confirm
          in: query
          schema: { type: boolean }
      responses:
        '204': { description: Категория удалена }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/categories/{categoryId}/parent:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/CategoryId'
    put:
      tags: [categories]
      operationId: moveCategory
      summary: Перенести категорию под другого родителя или в корень (администратор)
      description: 409 — `CATEGORY_CYCLE` (в себя или потомка), `CATEGORY_TOO_DEEP`, `CATEGORY_NAME_TAKEN`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveCategoryRequest' }
      responses:
        '200':
          description: Категория после переноса
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryInfo' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/categories/{categoryId}/delete-impact:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [categories]
      operationId: categoryDeleteImpact
      summary: Что будет удалено вместе с категорией (администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Число подкатегорий и публикаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryDeleteImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /reviews:
    post:
      tags: [reviews]
      operationId: createReview
      summary: Создать рекомендацию (при необходимости сразу опубликовать в группы)
      description: |
        Публиковать можно только в группы, где пользователь состоит (иначе 404), в категории этой группы
        (иначе 400 `VALIDATION_FAILED`, поле `publications`). 409 `LIMIT_EXCEEDED` — достигнут лимит.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: Рекомендация создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetails' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    get:
      tags: [reviews]
      operationId: searchReviews
      summary: Поиск по нескольким своим группам
      description: |
        Публикации в выбранных группах; без `groupIds` — во всех своих. Чужая группа — 404. Рекомендация,
        опубликованная в двух группах, приходит двумя карточками (поле `groupId`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupIds
          in: query
          description: Группы через запятую.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items: { type: string, format: uuid }
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/TagMode'
        - $ref: '#/components/parameters/AuthorId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница результатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [reviews]
      operationId: getReview
      summary: Рекомендация
      description: Видна автору и участникам групп, где она опубликована; иначе 404.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Рекомендация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetails' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    patch:
      tags: [reviews]
      operationId: updateReview
      summary: Изменить рекомендацию (автор)
      description: Чужую рекомендацию менять нельзя (для не автора она 404, если не видна, иначе 403).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReviewRequest' }
      responses:
        '200':
          description: Обновлённая рекомендация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetails' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    delete:
      tags: [reviews]
      operationId: deleteReview
      summary: Удалить рекомендацию вместе со всеми публикациями (автор)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Рекомендация удалена }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /reviews/{reviewId}/groups:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    put:
      tags: [reviews]
      operationId: setReviewPublications
      summary: Задать набор публикаций (автор)
      description: |
        Заменяет набор целиком: отсутствующие публикации снимаются, у сохранённых время публикации не меняется.
        Пустой набор делает рекомендацию личной.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPublicationsRequest' }
      responses:
        '200':
          description: Рекомендация с новым набором публикаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetails' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/tags:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [reviews]
      operationId: listGroupTags
      summary: Теги группы с числом публикаций (до 100, самые частые первыми)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: prefix
          in: query
          description: Начало тега (автодополнение).
          schema: { type: string, maxLength: 31 }
      responses:
        '200':
          description: Теги
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagCount' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /me/reviews:
    get:
      tags: [reviews]
      operationId: listMyReviews
      summary: Мои рекомендации (новые сверху)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница рекомендаций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/reviews:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [reviews]
      operationId: listGroupReviews
      summary: Лента группы (новые публикации сверху)
      description: |
        Только для участников (иначе 404). Без `q` — по времени публикации, с `q` — по релевантности.
        Курсор действует только с теми же фильтрами; курсор другого режима — 400.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/TagMode'
        - $ref: '#/components/parameters/AuthorId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/invitations:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Создать приглашение (администратор)
      description: |
        Токен возвращается только здесь. Если указан `email`, ему уходит письмо с токеном, и вступить
        по этому приглашению сможет только владелец адреса.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Приглашения группы (администратор)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Приглашения, новые первыми; токены не возвращаются
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvitationInfo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /groups/{groupId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Отозвать приглашение (администратор)
      description: Идемпотентно.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Приглашение отозвано }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /invitations/preview:
    post:
      tags: [invitations]
      operationId: previewInvitation
      summary: Посмотреть, в какую группу приглашают
      description: Токен передаётся в теле, а не в адресе, чтобы не попадать в журналы доступа.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationTokenRequest' }
      responses:
        '200':
          description: Сведения о группе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /invitations/share-preview:
    post:
      tags: [invitations]
      operationId: sharePreview
      summary: Предпросмотр переноса своих рекомендаций в группу, куда ведёт приглашение
      description: Ничего не меняет. Для записей без соответствия категории в новой группе возвращает список `unmatched`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharePreviewRequest' }
      responses:
        '200':
          description: Что будет перенесено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

  /invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Вступить в группу по приглашению
      security: [{ bearerAuth: [] }]
      description: |
        Необязательное `share` переносит рекомендации пользователя в новую группу по правилу (см. `share-preview`);
        рекомендации без соответствия категории переносятся, только если для них есть назначение в `assignments`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Пользователь вступил в группу
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `nextCursor` предыдущей страницы.
      schema: { type: string, maxLength: 200 }
    SearchQuery:
      name: q
      in: query
      description: Поиск по названию и описанию (морфология русского, опечатки, подстроки); с ним выдача упорядочена по релевантности.
      schema: { type: string, maxLength: 100 }
    CategoryIds:
      name: categoryIds
      in: query
      description: Категории (вместе с подкатегориями), через запятую.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 20
        items: { type: string, format: uuid }
    Tags:
      name: tags
      in: query
      description: Теги без `#`, через запятую.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 10
        items: { type: string, maxLength: 31 }
    TagMode:
      name: tagMode
      in: query
      description: «все теги» (по умолчанию) или «любой из тегов».
      schema: { type: string, enum: [ALL, ANY], default: ALL }
    AuthorId:
      name: authorId
      in: query
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpgradeRequired:
      description: Версия приложения устарела (заголовки `X-Client-Platform` и `X-Client-Version` ниже минимальной), нужно обновить приложение
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Слишком частые запросы
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: |
            Машинный код ошибки (`ErrorCode` в shared-contract). Список расширяемый: новые коды добавляются
            без смены версии API, клиент обязан обрабатывать неизвестный код как общую ошибку.
          x-extensible-enum:
            - VALIDATION_FAILED
            - CAPTCHA_FAILED
            - RATE_LIMITED
            - INVALID_CODE
            - INVALID_REGISTRATION_TOKEN
            - INVALID_REFRESH_TOKEN
            - UNAUTHORIZED
            - FORBIDDEN
            - USER_BLOCKED
            - NOT_FOUND
            - USERNAME_TAKEN
            - EMAIL_ALREADY_REGISTERED
            - LAST_ADMIN
            - INVALID_INVITATION
            - ALREADY_MEMBER
            - LIMIT_EXCEEDED
            - CONFIRMATION_REQUIRED
            - CATEGORY_NAME_TAKEN
            - CATEGORY_CYCLE
            - CATEGORY_TOO_DEEP
            - CATEGORY_HAS_FOREIGN_REVIEWS
            - UPGRADE_REQUIRED
            - INTERNAL_ERROR
        errors:
          type: array
          description: Ошибки полей (для `VALIDATION_FAILED`)
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string }
              reason:
                type: string
                enum: [REQUIRED, TOO_SHORT, TOO_LONG, INVALID_FORMAT, RESERVED]

    OtpRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        captchaToken: { type: string, nullable: true }

    OtpVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        deviceInfo: { type: string, maxLength: 200, nullable: true }

    OtpVerifyResponse:
      type: object
      description: Заполнено ровно одно из полей.
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        registrationToken: { type: string }

    RegisterRequest:
      type: object
      required: [registrationToken, username, displayName]
      properties:
        registrationToken: { type: string }
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.]+$'
          description: Уникален без учёта регистра; префикс `deleted_` зарезервирован.
        displayName: { type: string, maxLength: 60 }
        deviceInfo: { type: string, maxLength: 200, nullable: true }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          type: integer
          format: int64
          description: Срок жизни access-токена, секунд

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    UserProfile:
      type: object
      required: [id, email, username, displayName, bio, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string }
        displayName: { type: string }
        bio: { type: string }
        locale: { type: string, enum: [ru, en] }

    UpdateProfileRequest:
      type: object
      properties:
        username: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        bio: { type: string, maxLength: 120, nullable: true }
        locale: { type: string, enum: [ru, en], nullable: true }

    SessionInfo:
      type: object
      required: [id, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceInfo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }

    RoleInfo:
      type: object
      required: [id, code, title, description, admin, system]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        admin: { type: boolean }
        system: { type: boolean }

    GroupSummary:
      type: object
      required: [id, name, description, memberCount, myRole]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        memberCount: { type: integer }
        myRole: { $ref: '#/components/schemas/RoleInfo' }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    UpdateGroupRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }

    MemberInfo:
      type: object
      required: [userId, username, displayName, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/RoleInfo' }
        joinedAt: { type: string, format: date-time }

    SetMemberRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId: { type: string }

    CreateRoleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 255 }
        admin: { type: boolean }

    UpdateRoleRequest:
      type: object
      properties:
        title: { type: string, maxLength: 60, nullable: true }
        description: { type: string, maxLength: 255, nullable: true }
        admin: { type: boolean, nullable: true }

    CategoryInfo:
      type: object
      required: [id, parentId, name, description]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string }

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        parentId: { type: string, format: uuid, nullable: true }

    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }

    MoveCategoryRequest:
      type: object
      properties:
        parentId: { type: string, format: uuid, nullable: true }

    CategoryDeleteImpact:
      type: object
      required: [subcategories, publications, foreignPublications]
      properties:
        subcategories: { type: integer }
        publications: { type: integer }
        foreignPublications:
          type: integer
          description: Из публикаций — чужие; если больше нуля, удалить категорию нельзя (409 `CATEGORY_HAS_FOREIGN_REVIEWS`).

    ReviewAuthor:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }

    PublicationInfo:
      type: object
      required: [groupId, categoryId, sharedAt]
      properties:
        groupId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        sharedAt: { type: string, format: date-time }

    PublicationRequest:
      type: object
      required: [groupId, categoryId]
      properties:
        groupId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }

    ReviewDetails:
      type: object
      required: [id, title, description, rating, tags, author, createdAt, updatedAt, publications]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        rating: { type: integer, minimum: 1, maximum: 10 }
        tags:
          type: array
          items: { type: string }
        author: { $ref: '#/components/schemas/ReviewAuthor' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publications:
          type: array
          description: Автору — все публикации, остальным — только в их группах.
          items: { $ref: '#/components/schemas/PublicationInfo' }

    CreateReviewRequest:
      type: object
      required: [title, rating]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        rating: { type: integer, minimum: 1, maximum: 10 }
        tags:
          type: array
          maxItems: 10
          description: Без `#`; регистр не учитывается, повторы убираются.
          items: { type: string, maxLength: 31 }
        publications:
          type: array
          items: { $ref: '#/components/schemas/PublicationRequest' }

    UpdateReviewRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        tags:
          type: array
          nullable: true
          maxItems: 10
          items: { type: string, maxLength: 31 }

    SetPublicationsRequest:
      type: object
      required: [publications]
      properties:
        publications:
          type: array
          items: { $ref: '#/components/schemas/PublicationRequest' }

    ReviewCard:
      type: object
      required: [id, title, excerpt, rating, tags, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string, maxLength: 200 }
        rating: { type: integer }
        tags:
          type: array
          items: { type: string }
        author: { $ref: '#/components/schemas/ReviewAuthor' }
        createdAt: { type: string, format: date-time }
        categoryId: { type: string, format: uuid, nullable: true }
        sharedAt: { type: string, format: date-time, nullable: true }
        groupId: { type: string, format: uuid, nullable: true }

    TagCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    ReviewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewCard' }
        nextCursor: { type: string, nullable: true }

    CreateInvitationRequest:
      type: object
      properties:
        email: { type: string, maxLength: 254, nullable: true }
        maxUses: { type: integer, minimum: 1, maximum: 100, default: 1 }
        ttlHours: { type: integer, minimum: 1, maximum: 720, default: 168 }

    InvitationCreated:
      type: object
      required: [id, token, expiresAt, maxUses]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: Показывается один раз }
        email: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }

    InvitationInfo:
      type: object
      required: [id, createdBy, createdAt, expiresAt, maxUses, usedCount, revoked, active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        createdBy: { type: string, description: username автора }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer }
        usedCount: { type: integer }
        revoked: { type: boolean }
        active: { type: boolean }

    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }

    ShareMode:
      type: string
      enum: [NONE, ALL, CATEGORIES, CATEGORIES_EXCEPT, TAGS, TAGS_EXCEPT]

    ShareRule:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/ShareMode' }
        categoryIds:
          type: array
          maxItems: 20
          description: 'Категории исходных групп пользователя (для `CATEGORIES` и `CATEGORIES_EXCEPT`).'
          items: { type: string, format: uuid }
        tags:
          type: array
          maxItems: 10
          description: 'Теги (для `TAGS` и `TAGS_EXCEPT`): достаточно любого из них.'
          items: { type: string }
        withSubcategories:
          type: boolean
          default: true

    SharePreviewRequest:
      type: object
      required: [token, share]
      properties:
        token: { type: string, maxLength: 200 }
        share: { $ref: '#/components/schemas/ShareRule' }

    UnmatchedReview:
      type: object
      required: [reviewId, title]
      properties:
        reviewId: { type: string, format: uuid }
        title: { type: string }
        sourceCategory: { type: string, description: 'Категория в исходной группе; нет — рекомендация личная.' }

    SharePreview:
      type: object
      required: [total, matched, unmatched, categories]
      properties:
        total: { type: integer, description: Сколько рекомендаций отобрано правилом. }
        matched: { type: integer, description: Из них категория в новой группе подобрана автоматически. }
        unmatched:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/UnmatchedReview' }
        categories:
          type: array
          description: Категории новой группы для ручного выбора.
          items: { $ref: '#/components/schemas/CategoryInfo' }

    ShareAssignment:
      type: object
      required: [reviewId, categoryId]
      properties:
        reviewId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }

    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }
        share: { $ref: '#/components/schemas/ShareRule' }
        assignments:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ShareAssignment' }

    ReviewsFate:
      type: string
      enum: [RETURN_TO_PERSONAL, DELETE]

    GroupDeleteImpact:
      type: object
      required: [exclusiveReviews, publications]
      properties:
        exclusiveReviews: { type: integer, description: 'Рекомендации, опубликованные только в этой группе.' }
        publications: { type: integer, description: Все публикации в группе. }

    LeaveImpact:
      type: object
      required: [myPublications]
      properties:
        myPublications: { type: integer }

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    AccountDeleteImpact:
      type: object
      required: [reviews, publishedReviews, blockingGroups]
      properties:
        reviews: { type: integer }
        publishedReviews: { type: integer, description: Из них опубликованные хотя бы в одной группе. }
        blockingGroups:
          type: array
          description: Группы, где пользователь единственный администратор при наличии других участников.
          items: { $ref: '#/components/schemas/GroupRef' }

    DeleteAccountRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        deleteReviews: { type: boolean, default: false }

    InvitationPreview:
      type: object
      required: [groupName, groupDescription, memberCount, invitedBy]
      properties:
        groupName: { type: string }
        groupDescription: { type: string }
        memberCount: { type: integer }
        invitedBy: { type: string }
