      tags: [reviews]
      operationId: searchReviews
      summary: Лента «Все» и поиск по нескольким своим группам
      description: |
        Рекомендации, опубликованные в выбранных группах (допустимы свои системные); без `groupIds` — во всех
        своих обычных. Каждая рекомендация один раз (И15): `groupIds` — группы публикации в этой области,
        `sharedAt` — самая свежая из них; порядок без `q` — по `sharedAt`, с `q` — по релевантности.
        Чужая группа — 404. `section` сужает выборку до секции ленты (вместе с `q` — 400); `minRating > maxRating` — 400.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: groupIds
          in: query
          description: Группы через запятую.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items: { type: string, format: uuid }
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TitleOnly'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/Tags'
        - $ref: '#/components/parameters/TagMode'
        - $ref: '#/components/parameters/AuthorIds'
        - $ref: '#/components/parameters/MinRating'
        - $ref: '#/components/parameters/MaxRating'
        - $ref: '#/components/parameters/Section'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница результатов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }

