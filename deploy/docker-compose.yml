# Локальная среда разработки: backend + PostgreSQL + Mailpit (перехват писем).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: podgon
      POSTGRES_USER: podgon
      POSTGRES_PASSWORD: ${PODGON_DB_PASSWORD:-podgon_dev}
      # Пароль роли приложения podgon_app (создаётся скриптом db-init при первом запуске тома)
      PODGON_APP_DB_PASSWORD: ${PODGON_APP_DB_PASSWORD:-podgon_app_dev}
      LANG: C.UTF-8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./db-init/app-role.sql:/docker-entrypoint-initdb.d/app-role.sql.template:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podgon -d podgon"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"   # веб-интерфейс
      - "127.0.0.1:1025:1025"   # SMTP

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PODGON_DB_URL: jdbc:postgresql://db:5432/podgon
      # Приложение — ролью без DDL, миграции — владельцем схемы (R6)
      PODGON_DB_USER: podgon_app
      PODGON_DB_PASSWORD: ${PODGON_APP_DB_PASSWORD:-podgon_app_dev}
      PODGON_DB_MIGRATOR_USER: podgon
      PODGON_DB_MIGRATOR_PASSWORD: ${PODGON_DB_PASSWORD:-podgon_dev}
      PODGON_SMTP_HOST: mailpit
      PODGON_SMTP_PORT: "1025"
      # Только для локальной разработки: в окружениях Selectel значения задаются секретами и иные
      PODGON_CAPTCHA_MODE: disabled
      PODGON_CODE_HMAC_SECRET: ${PODGON_CODE_HMAC_SECRET:-dev-only-code-hmac-secret-change-me-0123456789}
      PODGON_AUTH_JWTKEYS_K1: ${PODGON_AUTH_JWTKEYS_K1:-ZGV2LW9ubHktand0LWtleS1jaGFuZ2UtbWUtMDEyMzQ1Njc4OWFiY2RlZg==}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
