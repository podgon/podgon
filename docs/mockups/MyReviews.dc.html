<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Podgon — мои рекомендации</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D9532F}a:hover{color:#B8401F}
.pg-scroll::-webkit-scrollbar{display:none}
.pg-scroll>*{flex-shrink:0}
.pg-field:focus{outline:none}
.pg-field::placeholder{color:#9A98A0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Manrope', system-ui, sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 18px 16px 10px; flex: none;">
    <a href="Profile.dc.html" aria-label="Назад" title="Назад" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; text-align: center; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Мои рекомендации</span>
    <span style="width: 44px; flex: none;"></span>
  </header>

  <main class="pg-scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 0 112px;">
    <p style="margin: 0; padding: 0 20px 10px; font-size: 13px; line-height: 1.45; color: {{c.muted}};">Рекомендации, которые вы опубликовали в группах. Личные — в разделе «Личное».</p>
    <div style="border-top: 1px solid {{c.line}};">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <a href="ReviewOwn.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 18px 12px 20px; border-bottom: 1px solid {{c.line}}; color: {{c.ink}}; text-decoration: none;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
            <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.title}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{c.muted}}; white-space: nowrap; min-width: 0;">
              <span style="display: flex; align-items: center; gap: 3px; flex: none; color: {{c.ink}}; font-weight: 700;"><svg width="14" height="14" viewBox="0 0 24 24" fill="{{c.accent}}" aria-hidden="true"><path d="M12 3.2l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z"></path></svg>{{r.rating}}<span style="font-weight: 500; color: {{c.muted}};">/10</span></span>
              <span aria-hidden="true">·</span><span style="flex: none;">{{r.cat}}</span>
              <span aria-hidden="true">·</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{r.groups}}</span>
            </span>
          </span>
          <span style="flex: none; font-size: 12px; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{r.when}}</span>
        </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Основное меню" style="position: absolute; z-index: 5; left: 16px; right: 16px; bottom: 22px; height: 68px; border-radius: 34px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.barShadow}}; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; box-sizing: border-box;">
    <a href="Main.dc.html" aria-current="page" style="text-decoration: none; width: 68px; height: 54px; border-radius: 27px; background: {{c.chip}}; color: {{c.ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="3"></rect><path d="M4 15.5h16M4 19.5h10"></path></svg>
      <span style="font-size: 11px; font-weight: 700;">Лента</span>
    </a>
    <button type="button" style="border: none; font-family: inherit; cursor: pointer; padding: 0; width: 68px; height: 54px; border-radius: 27px; background: transparent; color: {{c.muted}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Избранное</span>
    </button>
    <a href="ReviewForm.dc.html" aria-label="Новая рекомендация" title="Новая рекомендация" style="width: 54px; height: 54px; flex: none; border-radius: 27px; background: {{c.accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px {{c.accentGlow}};">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <button type="button" style="border: none; font-family: inherit; cursor: pointer; padding: 0; width: 68px; height: 54px; border-radius: 27px; background: transparent; color: {{c.muted}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4.5"></circle><path d="M11.2 11.8 20 3M16.5 6.5l2.5 2.5M14 9l2 2"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Личное</span>
    </button>
    <a href="Settings.dc.html" style="text-decoration: none; width: 68px; height: 54px; border-radius: 27px; background: transparent; color: {{c.muted}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.2 2.5h-.4a1.8 1.8 0 0 0-1.8 1.8v.2a1.8 1.8 0 0 1-.9 1.5l-.4.2a1.8 1.8 0 0 1-1.8 0l-.1-.1a1.8 1.8 0 0 0-2.5.7l-.2.3a1.8 1.8 0 0 0 .7 2.5l.1.1a1.8 1.8 0 0 1 .9 1.5v.5a1.8 1.8 0 0 1-.9 1.6l-.1.1a1.8 1.8 0 0 0-.7 2.5l.2.3a1.8 1.8 0 0 0 2.5.7l.1-.1a1.8 1.8 0 0 1 1.8 0l.4.2a1.8 1.8 0 0 1 .9 1.5v.2a1.8 1.8 0 0 0 1.8 1.8h.4a1.8 1.8 0 0 0 1.8-1.8v-.2a1.8 1.8 0 0 1 .9-1.5l.4-.2a1.8 1.8 0 0 1 1.8 0l.1.1a1.8 1.8 0 0 0 2.5-.7l.2-.3a1.8 1.8 0 0 0-.7-2.5l-.1-.1a1.8 1.8 0 0 1-.9-1.6v-.4a1.8 1.8 0 0 1 .9-1.6l.1-.1a1.8 1.8 0 0 0 .7-2.5l-.2-.3a1.8 1.8 0 0 0-2.5-.7l-.1.1a1.8 1.8 0 0 1-1.8 0l-.4-.2a1.8 1.8 0 0 1-.9-1.5v-.2a1.8 1.8 0 0 0-1.8-1.8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span style="font-size: 11px; font-weight: 600;">Настройки</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var light = {
      bg: '#F6F5F2', surface: '#FFFFFF', chip: '#ECEAE5', ink: '#1B1B1F', muted: '#5E5D66', line: '#E4E2DD', lineStrong: '#B9B6AF',
      accent: '#D9532F', accentGlow: 'rgba(217,83,47,0.35)', accentSoft: '#FBE4DC', accentInk: '#9A3415', disabled: '#C9C6C0',
      danger: '#C0352B', dangerSoft: '#FBE3E0',
      shadow: '0 4px 14px rgba(27,27,31,0.07)', barShadow: '0 10px 30px rgba(27,27,31,0.14)',
      tabOnBg: '#1B1B1F', tabOnFg: '#FFFFFF', segOn: '#FFFFFF', segShadow: '0 1px 4px rgba(27,27,31,0.12)', scrim: 'rgba(27,27,31,0.32)'
    };
    var night = {
      bg: '#121214', surface: '#1E1E22', chip: '#2C2C31', ink: '#F2F1EE', muted: '#A9A8B0', line: '#2E2E34', lineStrong: '#55555D',
      accent: '#F0673F', accentGlow: 'rgba(240,103,63,0.30)', accentSoft: '#3A2219', accentInk: '#FFB59C', disabled: '#45454C',
      danger: '#FF8A7A', dangerSoft: '#3A1F1C',
      shadow: 'none', barShadow: '0 10px 30px rgba(0,0,0,0.5)',
      tabOnBg: '#F2F1EE', tabOnFg: '#121214', segOn: '#45454C', segShadow: 'none', scrim: 'rgba(0,0,0,0.55)'
    };
    var c = dark ? night : light;
    var rows = [
      ['Кофейня «Зерно» на Покровке', 9, 'Кофейни', 'Друзья, Работа', '14:05'],
      ['Грузинский ресторан «Сакартвело»', 7, 'Грузинская кухня', 'Работа', '22 окт.'],
      ['Сыроварня в Истре', 9, 'Сыроварни', 'Друзья, Семья', '20 окт.'],
      ['Проект «Аве Мария», Энди Вейер', 10, 'Фантастика', 'Книжный клуб', '18 окт.'],
      ['Бассейн «Чайка»', 8, 'Спорт', 'Бег', '6 окт.'],
      ['Ремонт обуви у метро Сокол', 8, 'Ремонт', 'Семья', '30.09.2025'],
      ['Стоунер, Джон Уильямс', 9, 'Проза', 'Книжный клуб, Друзья', '24.09.2025']
    ].map(function (r) { return { title: r[0], rating: r[1], cat: r[2], groups: r[3], when: r[4] }; });
    return { c: c, rows: rows };
  }
}
</script>
</body>
</html>
