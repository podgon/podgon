<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Podgon — панель фильтров</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D9532F}a:hover{color:#B8401F}
.pg-scroll::-webkit-scrollbar{display:none}
.pg-field:focus{outline:none}
.pg-scroll>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Manrope', system-ui, sans-serif;">

  <!-- Шапка панели: скрыть · заголовок · сохранить фильтр -->
  <header style="display: flex; align-items: center; gap: 8px; padding: 18px 16px 8px; flex: none;">
    <a href="Main.dc.html" aria-label="Скрыть фильтры" title="Скрыть фильтры" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;">
      <span style="font-size: 17px; font-weight: 800;">Фильтры</span>
      <span style="font-size: 12px; color: {{c.muted}};">в группе «Друзья»</span>
    </div>
    <button type="button" aria-label="Сохранить фильтр" title="Сохранить фильтр" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4h11v16.5L12 16.8l-5.5 3.7z"></path><path d="M12 7.5v5M9.5 10h5"></path></svg>
    </button>
  </header>

  <!-- Сохранённые фильтры: выпадающий список с поиском -->
  <div style="position: relative; z-index: 6; padding: 4px 16px 10px; flex: none;">
    <button type="button" aria-haspopup="listbox" aria-expanded="{{savedExpanded}}" onClick="{{toggleSaved}}" style="width: 100%; height: 44px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; box-shadow: {{c.shadow}}; color: {{c.ink}}; font-family: inherit; display: flex; align-items: center; gap: 10px; padding: 0 14px; cursor: pointer; text-align: left;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="{{savedIconFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4h11v16.5L12 16.8l-5.5 3.7z"></path></svg>
      <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: {{savedWeight}}; color: {{savedColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{savedTitle}}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{savedChevron}};"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <sc-if value="{{savedOpen}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 16px; right: 16px; top: 54px; border-radius: 20px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.popShadow}}; padding: 8px; display: flex; flex-direction: column; gap: 4px;">
        <label style="height: 38px; border-radius: 19px; background: {{c.chip}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; cursor: text;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
          <input class="pg-field" type="search" aria-label="Найти сохранённый фильтр" placeholder="Найти фильтр" value="{{savedQuery}}" onChange="{{onSavedQuery}}" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; color: {{c.ink}}; padding: 0;">
        </label>
        <div role="listbox" aria-label="Сохранённые фильтры" style="display: flex; flex-direction: column;">
          <sc-for list="{{saved}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 4px; border-radius: 12px; background: {{s.bg}};">
              <button type="button" role="option" aria-selected="{{s.pressed}}" onClick="{{s.pick}}" style="flex: 1; min-width: 0; min-height: 44px; border: none; background: transparent; color: {{c.ink}}; font-family: inherit; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 4px 12px; text-align: left; cursor: pointer;">
                <span style="font-size: 14px; font-weight: 700;">{{s.name}}</span>
                <span style="font-size: 12px; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{s.summary}}</span>
              </button>
              <!-- Секция в ленте: закрепить фильтр вверху ленты -->
              <button type="button" aria-pressed="{{s.feedPressed}}" aria-label="{{s.feedLabel}}" title="{{s.feedLabel}}" onClick="{{s.toggleFeed}}" style="flex: none; height: 30px; margin-right: 6px; padding: 0 10px; border: none; border-radius: 15px; background: {{s.feedBg}}; color: {{s.feedFg}}; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; cursor: pointer;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="{{s.feedFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5h6l-1 6 3.5 3.5h-11L10 9.5z"></path><path d="M12 13v7.5"></path></svg>В ленте
              </button>
            </div>
          </sc-for>
          <sc-if value="{{savedNone}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; padding: 10px 12px; font-size: 13px; color: {{c.muted}};">Ничего не нашлось</p>
          </sc-if>
        </div>
      </div>
    </sc-if>
  </div>

  <main class="pg-scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 2px 16px 150px; display: flex; flex-direction: column; gap: 12px;">

    <!-- Оценка — первой: одна строка, ползунки перетаскиваются, значения внутри них -->
    <section style="border-radius: 22px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.shadow}}; padding: 10px 14px; display: flex; align-items: center; gap: 14px;">
      <h2 style="margin: 0; font-size: 15px; font-weight: 800; flex: none;">Оценка</h2>
      <div role="slider" aria-label="Оценка" aria-valuetext="{{ratingAria}}" onPointerDown="{{onSlideStart}}" onPointerMove="{{onSlideMove}}" onPointerUp="{{onSlideEnd}}" onPointerCancel="{{onSlideEnd}}" style="position: relative; flex: 1; height: 32px; margin: 0 12px; cursor: pointer; touch-action: none; user-select: none;">
        <div style="position: absolute; left: 0; right: 0; top: 15px; height: 2px; border-radius: 1px; background: {{c.chip}};"></div>
        <div style="position: absolute; left: {{rangeLeft}}; width: {{rangeWidth}}; top: 14px; height: 4px; border-radius: 2px; background: {{c.accent}};"></div>
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="10">
          <span aria-hidden="true" style="position: absolute; left: {{t.left}}; top: 14px; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: {{t.dot}}; pointer-events: none;"></span>
        </sc-for>
        <sc-for list="{{thumbs}}" as="h" hint-placeholder-count="2">
          <span aria-hidden="true" style="position: absolute; left: {{h.left}}; top: 4px; width: 24px; height: 24px; margin-left: -12px; border-radius: 12px; background: {{c.accent}}; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px {{c.accentGlow}}; pointer-events: none; font-variant-numeric: tabular-nums;">{{h.n}}</span>
        </sc-for>
      </div>
    </section>

    <!-- Категории, теги, авторы: поиск справа от заголовка, показываются только выбранные -->
    <sc-for list="{{pickers}}" as="p" hint-placeholder-count="3">
      <section style="position: relative; z-index: {{p.z}}; border-radius: 22px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.shadow}}; padding: 14px 12px 14px 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 32px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 800; white-space: nowrap;">{{p.name}}</h2>
          <sc-if value="{{p.empty}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 13px; color: {{c.muted}}; white-space: nowrap;">любые</span>
          </sc-if>
          <span style="flex: 1;"></span>
          <sc-if value="{{p.showMode}}" hint-placeholder-val="{{false}}">
            <div role="radiogroup" aria-label="Совпадение тегов" style="flex: none; display: flex; gap: 2px; padding: 2px; border-radius: 14px; background: {{c.chip}};">
              <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
                <button type="button" role="radio" aria-checked="{{m.checked}}" title="{{m.hint}}" onClick="{{m.pick}}" style="height: 24px; padding: 0 8px; border: none; border-radius: 12px; background: {{m.bg}}; color: {{m.fg}}; box-shadow: {{m.shadow}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;">{{m.label}}</button>
              </sc-for>
            </div>
          </sc-if>

          <div style="position: relative; flex: none;">
            <label style="width: 164px; height: 32px; border-radius: 16px; background: {{c.chip}}; display: flex; align-items: center; gap: 6px; padding: 0 10px; box-sizing: border-box; cursor: text;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
              <input class="pg-field" type="search" aria-label="{{p.searchLabel}}" placeholder="Найти" value="{{p.query}}" onChange="{{p.onQuery}}" onFocus="{{p.onFocus}}" onBlur="{{p.onBlur}}" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; color: {{c.ink}}; padding: 0;">
            </label>
            <sc-if value="{{p.showSuggest}}" hint-placeholder-val="{{false}}">
              <div role="listbox" aria-label="{{p.searchLabel}}" style="position: absolute; right: 0; top: 38px; width: 256px; max-height: 260px; overflow-y: auto; border-radius: 18px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.popShadow}}; padding: 6px; box-sizing: border-box;">
                <sc-for list="{{p.suggest}}" as="s" hint-placeholder-count="5">
                  <button type="button" role="option" aria-selected="{{s.selected}}" onMouseDown="{{keepFocus}}" onClick="{{s.pick}}" style="width: 100%; min-height: 40px; border: none; border-radius: 12px; background: {{s.bg}}; color: {{c.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; cursor: pointer;">
                    <span style="width: 18px; height: 18px; flex: none; border-radius: 6px; border: 1.5px solid {{s.boxBorder}}; background: {{s.boxBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
                      <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
                    </span>
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.label}}</span>
                      <sc-if value="{{s.hasPath}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 500; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.path}}</span></sc-if>
                    </span>
                    <span style="font-size: 12px; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{s.count}}</span>
                  </button>
                </sc-for>
                <sc-if value="{{p.noMatches}}" hint-placeholder-val="{{false}}">
                  <p style="margin: 0; padding: 10px; font-size: 13px; color: {{c.muted}};">Ничего не нашлось</p>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </div>
        <!-- Только выбранные; плотная укладка: невысокие чипы, малые отступы -->
        <sc-if value="{{p.hasChips}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 5px;">
            <sc-for list="{{p.chips}}" as="k" hint-placeholder-count="2">
              <span style="height: 30px; padding: 0 2px 0 {{k.padLeft}}; border-radius: 15px; background: {{c.tabOnBg}}; color: {{c.tabOnFg}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px; box-sizing: border-box; white-space: nowrap;">
                <sc-if value="{{k.hasAvatar}}" hint-placeholder-val="{{false}}">
                  <span style="width: 24px; height: 24px; border-radius: 12px; background: {{c.accent}}; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{k.letter}}</span>
                </sc-if>
                {{k.label}}
                <button type="button" aria-label="{{k.removeLabel}}" onClick="{{k.remove}}" style="width: 24px; height: 24px; border: none; border-radius: 12px; background: transparent; color: {{c.tabOnFg}}; opacity: 0.7; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg>
                </button>
              </span>
            </sc-for>
          </div>
        </sc-if>
      </section>
    </sc-for>

  </main>

  <!-- Сброс и применение: внизу справа, одна над другой -->
  <div style="position: absolute; z-index: 10; right: 16px; bottom: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <button type="button" aria-label="Сбросить фильтры" title="Сбросить фильтры" onClick="{{reset}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; box-shadow: {{c.popShadow}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path><path d="M4.5 4.5v4h4"></path></svg>
    </button>
    <a href="Main.dc.html" aria-label="Применить фильтры" title="Применить фильтры" style="width: 58px; height: 58px; border-radius: 29px; background: {{c.accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px {{c.accentGlow}};">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sel: { 'c:Кофейни': true, 'c:Бары': true, 't:кофе': true, 't:завтраки': true, 't:центр': true, 't:недорого': true, 'a:Анна Смирнова': true },
      feed: { 'Кофе 9–10': true },
      mode: 'all', min: 7, max: 10, focus: null, q: { c: '', t: '', a: '' }, savedOpen: false, savedQ: ''
    };
    this.thumb = null;
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var dark = !!this.props.dark;
    var light = {
      bg: '#F6F5F2', surface: '#FFFFFF', chip: '#ECEAE5', ink: '#1B1B1F', muted: '#5E5D66', line: '#E4E2DD', lineStrong: '#B9B6AF',
      accent: '#D9532F', accentGlow: 'rgba(217,83,47,0.35)', accentSoft: '#FBE4DC', accentInk: '#9A3415',
      shadow: '0 4px 14px rgba(27,27,31,0.07)', popShadow: '0 10px 28px rgba(27,27,31,0.16)',
      tabOnBg: '#1B1B1F', tabOnFg: '#FFFFFF', segOn: '#FFFFFF', segShadow: '0 1px 4px rgba(27,27,31,0.12)'
    };
    var night = {
      bg: '#121214', surface: '#1E1E22', chip: '#2C2C31', ink: '#F2F1EE', muted: '#A9A8B0', line: '#2E2E34', lineStrong: '#55555D',
      accent: '#F0673F', accentGlow: 'rgba(240,103,63,0.30)', accentSoft: '#3A2219', accentInk: '#FFB59C',
      shadow: 'none', popShadow: '0 10px 28px rgba(0,0,0,0.55)',
      tabOnBg: '#F2F1EE', tabOnFg: '#121214', segOn: '#45454C', segShadow: 'none'
    };
    var c = dark ? night : light;
    var sel = st.sel;
    function toggle(key) {
      var next = Object.assign({}, self.state.sel);
      if (next[key]) delete next[key]; else next[key] = true;
      self.setState({ sel: next });
    }
    // Значения со счётчиками: только то, что есть в текущей группе
    var data = {
      // Категории: в чипе — только лист, в подсказке — ещё и путь родителя
      c: [['Рестораны', 38], ['Кофейни', 14, 'Рестораны › Кафе и кофейни'], ['Бары', 9, 'Рестораны'], ['Грузинская кухня', 6, 'Рестораны'], ['Фильмы', 27], ['Книги', 19], ['Фантастика', 7, 'Книги'], ['Сериалы', 14], ['Путешествия', 12], ['Услуги', 11], ['Здоровье', 8], ['Спорт', 6], ['Без категории', 3]],
      t: [['кофе', 14], ['завтраки', 9], ['центр', 8], ['недорого', 7], ['сдетьми', 5], ['веганское', 3], ['работаетночью', 2]],
      a: [['Анна Смирнова', 31], ['Олег', 22], ['Ирина Ковалёва', 17], ['Дмитрий', 15], ['Максим Петров', 9], ['Елена', 6]]
    };
    var defs = [
      { id: 'c', name: 'Категории', searchLabel: 'Найти категорию' },
      { id: 't', name: 'Теги', searchLabel: 'Найти тег', hasMode: true },
      { id: 'a', name: 'Авторы', searchLabel: 'Найти автора' }
    ];
    var pickers = defs.map(function (d) {
      var q = st.q[d.id].trim().toLowerCase();
      var focused = st.focus === d.id;
      var matches = data[d.id].filter(function (x) { return !q || (x[0] + ' ' + (x[2] || '')).toLowerCase().indexOf(q) >= 0; }).slice(0, 6);
      var shown = function (label) { return d.id === 't' ? '#' + label : label; };
      var chips = data[d.id].filter(function (x) { return sel[d.id + ':' + x[0]]; }).map(function (x) {
        return {
          label: shown(x[0]), letter: x[0].charAt(0), hasAvatar: d.id === 'a', padLeft: d.id === 'a' ? '4px' : '12px',
          removeLabel: 'Убрать ' + shown(x[0]), remove: function () { toggle(d.id + ':' + x[0]); }
        };
      });
      return {
        name: d.name, searchLabel: d.searchLabel, emptyText: 'Любые', showMode: !!d.hasMode && chips.length >= 2,
        z: focused ? 3 : 1, query: st.q[d.id], chips: chips, empty: chips.length === 0, hasChips: chips.length > 0,
        showSuggest: focused, noMatches: matches.length === 0,
        suggest: matches.map(function (x) {
          var on = !!sel[d.id + ':' + x[0]];
          return {
            label: shown(x[0]), count: x[1], on: on, selected: on ? 'true' : 'false', hasPath: !!x[2], path: x[2] || '',
            bg: on ? c.chip : 'transparent', boxBg: on ? c.accent : 'transparent', boxBorder: on ? c.accent : c.lineStrong,
            pick: function () { toggle(d.id + ':' + x[0]); }
          };
        }),
        onQuery: function (e) { var q2 = Object.assign({}, self.state.q); q2[d.id] = e.target.value; self.setState({ q: q2 }); },
        onFocus: function () { self.setState({ focus: d.id }); },
        onBlur: function () { setTimeout(function () { if (self.state.focus === d.id) self.setState({ focus: null }); }, 120); }
      };
    });
    var mode = st.mode;
    var modes = [{ id: 'all', label: 'Все', hint: 'Все выбранные теги' }, { id: 'any', label: 'Любой', hint: 'Хотя бы один тег' }].map(function (m) {
      var on = mode === m.id;
      return {
        label: m.label, hint: m.hint, checked: on ? 'true' : 'false', bg: on ? c.segOn : 'transparent', fg: on ? c.ink : c.muted,
        shadow: on ? c.segShadow : 'none', pick: function () { self.setState({ mode: m.id }); }
      };
    });
    function pos(n) { return ((n - 1) / 9 * 100).toFixed(2) + '%'; }
    var ticks = [];
    for (var n = 1; n <= 10; n++) {
      (function (v) {
        var inRange = v >= st.min && v <= st.max;
        ticks.push({
          left: pos(v), dot: inRange ? c.accent : c.lineStrong
        });
      })(n);
    }
    var thumbs = st.min === st.max ? [{ left: pos(st.min), n: st.min }] : [{ left: pos(st.min), n: st.min }, { left: pos(st.max), n: st.max }];
    // Сохранённые фильтры: в прототипе — пример (хранение — см. design.md)
    function valueAt(e) {
      var r = e.currentTarget.getBoundingClientRect();
      var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      return Math.round(f * 9) + 1;
    }
    function moveThumb(v) {
      var mn = self.state.min, mx = self.state.max;
      if (self.thumb === 'min') mn = Math.min(v, mx); else mx = Math.max(v, mn);
      if (mn !== self.state.min || mx !== self.state.max) self.setState({ min: mn, max: mx });
    }
    var sq = st.savedQ.trim().toLowerCase();
    var saved = [
      { name: 'Кофе 9–10', sel: { 'c:Кофейни': true }, min: 9, max: 10 },
      { name: 'Кофе в центре', sel: { 'c:Кофейни': true, 't:кофе': true, 't:центр': true }, min: 7, max: 10 },
      { name: 'Фильмы 8+', sel: { 'c:Фильмы': true }, min: 8, max: 10 },
      { name: 'Книги от Дмитрия', sel: { 'c:Книги': true, 'a:Дмитрий': true }, min: 1, max: 10 },
      { name: 'С детьми', sel: { 't:сдетьми': true }, min: 1, max: 10 },
      { name: 'Бары на вечер', sel: { 'c:Бары': true, 't:работаетночью': true }, min: 7, max: 10 },
      { name: 'Недорого и с детьми', sel: { 't:недорого': true, 't:сдетьми': true }, min: 1, max: 10 }
    ].sort(function (x, y) { return x.name.localeCompare(y.name, 'ru'); }).filter(function (s) { return !sq || s.name.toLowerCase().indexOf(sq) >= 0; }).map(function (s) {
      var same = s.min === st.min && s.max === st.max &&
        Object.keys(s.sel).length === Object.keys(sel).length &&
        Object.keys(s.sel).every(function (k) { return sel[k]; });
      var parts = Object.keys(s.sel).map(function (k) { var v = k.slice(2); return k.charAt(0) === 't' ? '#' + v : v; });
      if (s.min > 1 || s.max < 10) parts.push('оценка ' + s.min + '–' + s.max);
      var inFeed = !!st.feed[s.name];
      return {
        feedPressed: inFeed ? 'true' : 'false', feedLabel: inFeed ? 'Убрать из ленты' : 'Показывать секцией в ленте',
        feedBg: inFeed ? c.accentSoft : c.chip, feedFg: inFeed ? c.accentInk : c.muted, feedFill: inFeed ? 'currentColor' : 'none',
        toggleFeed: function () { var f = Object.assign({}, self.state.feed); if (f[s.name]) delete f[s.name]; else f[s.name] = true; self.setState({ feed: f }); },
        name: s.name, pressed: same ? 'true' : 'false', same: same, summary: parts.join(' · '),
        bg: same ? c.chip : 'transparent',
        pick: function () { self.setState({ sel: Object.assign({}, s.sel), min: s.min, max: s.max, savedOpen: false, savedQ: '' }); }
      };
    });
    var current = saved.filter(function (x) { return x.same; })[0];
    return {
      savedOpen: st.savedOpen, savedExpanded: st.savedOpen ? 'true' : 'false', savedQuery: st.savedQ,
      savedNone: saved.length === 0, savedChevron: st.savedOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      savedTitle: current ? current.name : 'Сохранённые фильтры', savedColor: current ? c.ink : c.muted,
      savedWeight: current ? 700 : 600, savedIconFill: current ? 'currentColor' : 'none',
      toggleSaved: function () { self.setState({ savedOpen: !self.state.savedOpen }); },
      onSavedQuery: function (e) { self.setState({ savedQ: e.target.value }); },
      onSlideStart: function (e) {
        var v = valueAt(e);
        var mn = self.state.min, mx = self.state.max;
        self.thumb = v <= mn ? 'min' : (v >= mx ? 'max' : (v - mn <= mx - v ? 'min' : 'max'));
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        moveThumb(v);
      },
      onSlideMove: function (e) { if (self.thumb) moveThumb(valueAt(e)); },
      onSlideEnd: function () { self.thumb = null; },
      c: c, pickers: pickers, modes: modes, ticks: ticks, thumbs: thumbs, saved: saved,
      rangeLeft: pos(st.min), rangeWidth: ((st.max - st.min) / 9 * 100).toFixed(2) + '%',
      ratingAria: 'Оценка от ' + st.min + ' до ' + st.max,
      keepFocus: function (e) { e.preventDefault(); },
      reset: function () { self.setState({ sel: {}, mode: 'all', min: 1, max: 10, q: { c: '', t: '', a: '' } }); }
    };
  }
}
</script>
