<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Podgon — группы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D9532F}a:hover{color:#B8401F}
.pg-scroll::-webkit-scrollbar{display:none}
.pg-field:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Manrope', system-ui, sans-serif;">

  <!-- Шапка подэкрана: назад · заголовок -->
  <header style="display: flex; align-items: center; gap: 8px; padding: 18px 16px 10px; flex: none;">
    <a href="Settings.dc.html" aria-label="Назад" title="Назад" style="width: 44px; height: 44px; flex: none; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; text-align: center; font-size: 17px; font-weight: 800;">Группы</span>
    <span style="width: 44px; flex: none;"></span>
  </header>

  <!-- Поиск по группам -->
  <div style="padding: 0 16px 6px; flex: none;">
    <label style="height: 44px; border-radius: 22px; background: {{c.surface}}; box-shadow: {{c.shadow}}; border: 1px solid {{c.line}}; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box; cursor: text;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
      <input class="pg-field" type="search" aria-label="Найти группу" placeholder="Найти группу" value="{{query}}" onChange="{{onQuery}}" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 16px; color: {{c.ink}}; padding: 0;">
    </label>
  </div>

  <main class="pg-scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 6px 16px 112px; display: flex; flex-direction: column; gap: 12px;">
    <div style="border-radius: 22px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.shadow}}; overflow: hidden;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <a href="Group.dc.html" style="width: 100%; min-height: 64px; border-bottom: 1px solid {{c.line}}; color: {{c.ink}}; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px; box-sizing: border-box;">
          <span style="width: 38px; height: 38px; flex: none; border-radius: 13px; background: {{c.chip}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: {{c.ink}};">{{g.letter}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{g.name}}</span>
            <span style="font-size: 13px; color: {{c.muted}};">{{g.meta}}</span>
          </span>
          <sc-if value="{{g.admin}}" hint-placeholder-val="{{false}}">
            <span style="flex: none; height: 24px; padding: 0 10px; border-radius: 12px; background: {{c.accentSoft}}; color: {{c.accentInk}}; font-size: 12px; font-weight: 700; display: flex; align-items: center;">Админ</span>
          </sc-if>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; padding: 16px; font-size: 14px; color: {{c.muted}};">Ничего не нашлось</p>
      </sc-if>
    </div>
  </main>

  <!-- Нижнее меню: активны Настройки -->
  <nav aria-label="Основное меню" style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 68px; border-radius: 34px; background: {{c.surface}}; border: 1px solid {{c.line}}; box-shadow: {{c.barShadow}}; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; box-sizing: border-box;">
    <a href="Main.dc.html" style="width: 68px; height: 54px; border-radius: 27px; color: {{c.muted}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="3"></rect><path d="M4 15.5h16M4 19.5h10"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Лента</span>
    </a>
    <button type="button" style="width: 68px; height: 54px; border: none; border-radius: 27px; background: transparent; color: {{c.muted}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; padding: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Избранное</span>
    </button>
    <button type="button" aria-label="Новая группа или вступить по коду" title="Новая группа" onClick="{{openSheet}}" style="width: 54px; height: 54px; flex: none; border: none; border-radius: 27px; background: {{c.accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 16px {{c.accentGlow}};">
      <!-- На экране «Группы» «+» создаёт группу -->
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2"></circle><path d="M3.5 19a5.5 5.5 0 0 1 9-4.2"></path><path d="M18 13v7M14.5 16.5h7"></path></svg>
    </button>
    <button type="button" style="width: 68px; height: 54px; border: none; border-radius: 27px; background: transparent; color: {{c.muted}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; padding: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4.5"></circle><path d="M11.2 11.8 20 3M16.5 6.5l2.5 2.5M14 9l2 2"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Личное</span>
    </button>
    <a href="Settings.dc.html" aria-current="page" style="text-decoration: none; width: 68px; height: 54px; border: none; border-radius: 27px; background: {{c.chip}}; color: {{c.ink}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; padding: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.2 2.5h-.4a1.8 1.8 0 0 0-1.8 1.8v.2a1.8 1.8 0 0 1-.9 1.5l-.4.2a1.8 1.8 0 0 1-1.8 0l-.1-.1a1.8 1.8 0 0 0-2.5.7l-.2.3a1.8 1.8 0 0 0 .7 2.5l.1.1a1.8 1.8 0 0 1 .9 1.5v.5a1.8 1.8 0 0 1-.9 1.6l-.1.1a1.8 1.8 0 0 0-.7 2.5l.2.3a1.8 1.8 0 0 0 2.5.7l.1-.1a1.8 1.8 0 0 1 1.8 0l.4.2a1.8 1.8 0 0 1 .9 1.5v.2a1.8 1.8 0 0 0 1.8 1.8h.4a1.8 1.8 0 0 0 1.8-1.8v-.2a1.8 1.8 0 0 1 .9-1.5l.4-.2a1.8 1.8 0 0 1 1.8 0l.1.1a1.8 1.8 0 0 0 2.5-.7l.2-.3a1.8 1.8 0 0 0-.7-2.5l-.1-.1a1.8 1.8 0 0 1-.9-1.6v-.4a1.8 1.8 0 0 1 .9-1.6l.1-.1a1.8 1.8 0 0 0 .7-2.5l-.2-.3a1.8 1.8 0 0 0-2.5-.7l-.1.1a1.8 1.8 0 0 1-1.8 0l-.4-.2a1.8 1.8 0 0 1-.9-1.5v-.2a1.8 1.8 0 0 0-1.8-1.8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span style="font-size: 11px; font-weight: 700;">Настройки</span>
    </a>
  </nav>

  <!-- «+»: маленькое окно «Создать / Присоединиться» над клавиатурой -->
  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <div onClick="{{closeSheet}}" style="position: absolute; inset: 0; z-index: 8; background: {{c.scrim}};"></div>
    <div role="dialog" aria-label="{{sheetTitle}}" style="position: absolute; z-index: 9; left: 8px; right: 8px; bottom: 8px; border-radius: 28px; background: {{c.surface}}; box-shadow: {{c.barShadow}}; padding: 8px 14px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: {{c.line}}; margin: 2px auto 0;"></div>
      <div role="radiogroup" aria-label="Действие" style="display: flex; gap: 2px; padding: 3px; border-radius: 21px; background: {{c.chip}};">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="flex: 1; height: 36px; border: none; border-radius: 18px; background: {{m.bg}}; color: {{m.fg}}; box-shadow: {{m.shadow}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">{{m.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input class="pg-field" type="text" aria-label="{{fieldLabel}}" placeholder="{{fieldLabel}}" value="{{field}}" onChange="{{onField}}" style="flex: 1; min-width: 0; height: 48px; border: 1px solid {{c.line}}; border-radius: 16px; background: {{c.bg}}; font-family: inherit; font-size: 16px; font-weight: 600; letter-spacing: {{fieldSpacing}}; color: {{c.ink}}; padding: 0 14px; box-sizing: border-box;">
        <a href="{{goHref}}" aria-label="{{goLabel}}" title="{{goLabel}}" onClick="{{go}}" style="width: 48px; height: 48px; flex: none; border-radius: 24px; background: {{goBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: {{goShadow}};">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
      <p style="margin: 0 4px; font-size: 13px; line-height: 1.45; color: {{c.muted}};">{{sheetHint}}</p>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"sheet":{"editor":"enum","options":["none","create","join"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '', sheet: props.sheet && props.sheet !== 'none' ? props.sheet : null, field: props.sheet === 'join' ? 'KX7-4MQ-92D' : '' };
  }
  renderVals() {
    var self = this;
    var dark = !!this.props.dark;
    var light = {
      bg: '#F6F5F2', surface: '#FFFFFF', chip: '#ECEAE5', ink: '#1B1B1F', muted: '#5E5D66', line: '#E4E2DD',
      accent: '#D9532F', accentGlow: 'rgba(217,83,47,0.35)', accentSoft: '#FBE4DC', accentInk: '#9A3415',
      shadow: '0 4px 14px rgba(27,27,31,0.07)', barShadow: '0 10px 30px rgba(27,27,31,0.14)',
      tabOnBg: '#1B1B1F', tabOnFg: '#FFFFFF', segOn: '#FFFFFF', segShadow: '0 1px 4px rgba(27,27,31,0.12)', scrim: 'rgba(27,27,31,0.32)', disabled: '#C9C6C0'
    };
    var night = {
      bg: '#121214', surface: '#1E1E22', chip: '#2C2C31', ink: '#F2F1EE', muted: '#A9A8B0', line: '#2E2E34',
      accent: '#F0673F', accentGlow: 'rgba(240,103,63,0.30)', accentSoft: '#3A2219', accentInk: '#FFB59C',
      shadow: 'none', barShadow: '0 10px 30px rgba(0,0,0,0.5)',
      tabOnBg: '#F2F1EE', tabOnFg: '#121214', segOn: '#45454C', segShadow: 'none', scrim: 'rgba(0,0,0,0.55)', disabled: '#45454C'
    };
    var c = dark ? night : light;
    var groups = [
      { name: 'Друзья', meta: '12 участников · 148 рекомендаций', admin: true },
      { name: 'Работа', meta: '34 участника · 96 рекомендаций', admin: false },
      { name: 'Семья', meta: '5 участников · 0 рекомендаций', admin: true },
      { name: 'Книжный клуб', meta: '9 участников · 41 рекомендация', admin: false },
      { name: 'Бег', meta: '21 участник · 63 рекомендации', admin: false }
    ].filter(function (g) { var q = self.state.query.trim().toLowerCase(); return !q || g.name.toLowerCase().indexOf(q) >= 0; }).map(function (g) { return { name: g.name, meta: g.meta, admin: g.admin, letter: g.name.charAt(0) }; });
    var sheet = this.state.sheet;
    var join = sheet === 'join';
    var modes = [{ id: 'create', label: 'Создать' }, { id: 'join', label: 'Присоединиться' }].map(function (m) {
      var on = sheet === m.id;
      return {
        label: m.label, checked: on ? 'true' : 'false',
        bg: on ? c.segOn : 'transparent', fg: on ? c.ink : c.muted, shadow: on ? c.segShadow : 'none',
        pick: function () { self.setState({ sheet: m.id, field: '' }); }
      };
    });
    var ready = this.state.field.trim().length > (join ? 5 : 0);
    return {
      sheetOpen: !!sheet, modes: modes, field: this.state.field,
      sheetTitle: join ? 'Присоединиться к группе' : 'Новая группа',
      fieldLabel: join ? 'Код приглашения' : 'Название группы',
      fieldSpacing: join ? '1.5px' : '0',
      sheetHint: join ? 'Код присылает администратор группы. Дальше покажем группу и спросим, какими рекомендациями поделиться.'
        : 'Вы станете администратором. Описание и приглашения — на странице группы.',
      goLabel: join ? 'Проверить код' : 'Создать группу',
      goHref: ready ? (join ? 'Join.dc.html' : 'Group.dc.html') : '#',
      goBg: ready ? c.accent : c.disabled, goShadow: ready ? '0 6px 16px ' + c.accentGlow : 'none',
      go: function (e) { if (!ready) e.preventDefault(); },
      onField: function (e) { self.setState({ field: e.target.value }); },
      openSheet: function () { self.setState({ sheet: 'create', field: '' }); },
      closeSheet: function () { self.setState({ sheet: null }); },
      c: c, groups: groups, none: groups.length === 0, query: this.state.query,
      onQuery: function (e) { self.setState({ query: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
