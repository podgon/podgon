name: CI

on:
  pull_request:
    branches: [develop, stable, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  repo-checks:
    name: Проверки репозитория
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Файлы в UTF-8 без BOM и без CRLF
        run: |
          bad=0
          while IFS= read -r f; do
            if head -c3 "$f" | grep -q $'\xEF\xBB\xBF'; then echo "BOM: $f"; bad=1; fi
            if grep -q $'\r' "$f"; then echo "CRLF: $f"; bad=1; fi
          done < <(git ls-files '*.md' '*.yml' '*.yaml' '*.kt' '*.kts' '*.sql' '*.json')
          exit $bad

      - name: Нет секретов в репозитории
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.jks|.*\.keystore)$' | grep -v '\.env\.example$'; then
            echo "Найдены файлы, похожие на секреты"; exit 1
          fi

  server:
    name: Сервер (сборка и тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # Интеграционные тесты используют Testcontainers (Docker на раннере есть)
      - name: Сборка и тесты
        run: ./gradlew --no-daemon :server:build :shared-contract:check

      # Логи заданий видны только авторизованным: причины падения выводим аннотациями (читаются публично)
      - name: Причины падения тестов
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, html, re
          for f in glob.glob('server/build/test-results/test/*.xml'):
              s = open(f, encoding='utf-8').read()
              for m in re.finditer(r'<testcase name="([^"]*)"[^>]*>\s*<failure message="([^"]{0,400})', s):
                  text = html.unescape(m.group(1) + ' :: ' + m.group(2)).replace('\n', ' ')
                  print('::error title=Тест упал::' + text)
          PY

  mobile:
    name: Клиент (сборка и тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка, ktlint и unit-тесты
        run: ./gradlew --no-daemon :mobile:shared:check :mobile:androidApp:ktlintCheck :mobile:androidApp:assembleDebug

  # Обратная совместимость контракта (ADR-005, замечание R7 ревью): изменение, ломающее уже выпущенных
  # клиентов (удалённое поле, новый обязательный параметр и т. п.), роняет сборку. Сравнение — с базовой
  # веткой MR либо с предыдущим состоянием ветки при push.
  contract:
    name: Контракт API (обратная совместимость)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: oasdiff breaking
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_REF:api/openapi.yaml" 2>/dev/null; then
            echo "Нет базовой версии контракта — сравнивать не с чем"; exit 0
          fi
          git show "$BASE_REF:api/openapi.yaml" > base-openapi.yaml
          docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff:v1.33.0 \
            breaking base-openapi.yaml api/openapi.yaml --fail-on ERR

  # docker: сборка образа backend в CI — этап 10 (локально образ собирает docker compose)
