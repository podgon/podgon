    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    target-branch: develop
